name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Nothing here writes to the repository. Every action is pinned to a full commit SHA with its version in a
# trailing comment (Dependabot keeps both current, see .github/dependabot.yml), and no checkout leaves the
# token behind in .git/config.
permissions:
  contents: read

jobs:
  format:
    name: Format (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Palantir Java Format currently depends on JDK 25-era javac internals. Keep formatting
      # isolated here so the JDK 27 compatibility lane can exercise the application itself.
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check formatting
        run: ./mvnw -B --no-transfer-progress spotless:check

  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '25'
            distribution: temurin
          # Temurin 27 binaries were not yet published on GA day; Oracle provides the GA build.
          - java: '27'
            distribution: oracle

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress -Dmaven.compiler.release=${{ matrix.java }} -Dspotless.check.skip=true verify

  # Windows and macOS installers ship from every release, but until this job existed no test ever ran on
  # either: both were only compiled and packaged at tag time. This runs the PURE suite there (everything
  # not tagged `fx` — no toolkit, no display), which is where path separators, line endings, case-insensitive
  # file systems, process spawning and charset defaults bite. The headless-FX suite stays on Linux.
  # `test`, not `verify`: the JaCoCo floors are calibrated against the full suite.
  pure-tests:
    name: Pure tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The Windows lane is informational for now: its first run found 47 failures in 24 test classes, mostly
    # tests that assume POSIX paths (the suite had never run on Windows). It stays visible but does not block
    # a merge until those are worked through; make it required again by deleting this line. macOS blocks.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test (pure suite)
        shell: bash
        run: ./mvnw -B --no-transfer-progress -DexcludedGroups=fx test

  # The release and packaging scripts have their own unit tests (the release-asset manifest, the tarball
  # installer, the .deb maintainer scripts run against a scratch root, the pinned-download check). They are
  # Python `unittest` files beside the scripts; nothing else runs them.
  scripts:
    name: Release & packaging scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in packaging/linux/postinst packaging/linux/postrm packaging/linux/tarball-install.sh; do
            sh -n "$script"
          done

      - name: Run script unit tests
        run: |
          for dir in scripts scripts/release scripts/packaging scripts/native; do
            python3 -m unittest discover -s "$dir" -p 'test_*.py'
          done

  compact-source-probes:
    name: Compact Java integration (JDK 25)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install JDT LS and Java debug adapter
        run: |
          scripts/install-jdtls.sh
          scripts/install-java-debug.sh
          test -x "$HOME/.editora/plugins/lsp/java/bin/jdtls"
          compgen -G "$HOME/.editora/plugins/dap/java/com.microsoft.java.debug.plugin-*.jar"

      - name: Test compact Java language service and debugging
        run: ./mvnw -B --no-transfer-progress -Dtest=JdtlsCompactSourceProbeTest,CompactSourceDebugProbeFxTest -Dgroups=probe -Dlsp.probe=true test
