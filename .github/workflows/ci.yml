name: CI

# The fast lane: formatting, the whole suite on Linux (four shards, coverage floors) and the scripts' own
# tests, about ten minutes. It runs on every pull request and every push to master, and the two checks master
# requires come from here. The Windows and macOS suites and the probes against real tools are in
# full-tests.yml: once a day on master, on a pull request labelled `full-ci`, and before every release.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The release workflow's `bump` job dispatches this on its `chore/reopen-X.Y.Z` branch: a pull request
  # opened with the default GITHUB_TOKEN triggers no `pull_request` run, and master requires these checks.
  workflow_dispatch: {}

# Nothing here writes to the repository. Every action is pinned to a full commit SHA with its version in a
# trailing comment (Dependabot keeps both current, see .github/dependabot.yml), and no checkout leaves the
# token behind in .git/config.
permissions:
  contents: read

# A new push to a pull request cancels the run still going for the previous one: nobody reads that verdict,
# and stale runs made live ones queue for runners.
#
# Every other run (a push to master, a dispatched run) has a group of its own, its commit, so it is never
# queued or cancelled and each merge keeps its own result. They shared one group, `refs/heads/master`, until
# 15 October 2026: GitHub keeps at most one run *waiting* in a group, so with cancel-in-progress off a merge
# landing behind another cancelled the run still waiting before it, and 13 of 60 merge commits had no CI run.
# The release preflight requires the checks to have passed on the tagged commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Palantir Java Format currently depends on JDK 25-era javac internals. Keep formatting
      # isolated here so a newer-JDK compatibility lane (JDK 27, disabled for now) can exercise the
      # application itself.
      #
      # Its Maven cache holds only Spotless, so it has a key of its own (the poms alone). The jobs that build
      # and test hash .mvn/maven.config too: a cache is saved once per key, by the first job to finish, and
      # this one finishes first. Sharing the key, it saved 20 MB of the 77 MB the test jobs need, and every
      # Linux test job then fetched the rest from Maven Central on every run.
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check formatting
        run: ./mvnw -B --no-transfer-progress spotless:check

  # The Linux suite, on four runners at once. In one JVM on one runner it was 15 of the job's 17 minutes and
  # growing with every pull request; two JVMs on one runner share its cores, which gained little and made
  # timing-sensitive tests fail. A shard is still one JVM with a runner to itself, as before, with a
  # quarter of the classes (scripts/ci/ShardTests.java deals them out). Nothing here is a required check: the
  # `build` job below collects the four results under the name master's ruleset asks for.
  #
  # A JDK 27 compatibility lane was a second leg of this job's matrix and is disabled for now. To bring
  # it back add a `java` dimension here (Temurin 27 binaries were not yet published on GA day; Oracle
  # provides the GA build) and pass `-Dmaven.compiler.release`.
  tests:
    name: Tests (Linux, shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config

      # Tests guarded by a tool on the PATH skip, they do not fail, when the tool is missing. ripgrep
      # backs Find and Replace in Files; without it those tests would be silently skipped here.
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version

      - name: List this shard's test classes
        run: |
          mkdir -p target
          java scripts/ci/ShardTests.java list ${{ matrix.shard }} 4 > target/shard-includes.txt
          echo "$(wc -l < target/shard-includes.txt) test classes in this shard"

      # A test that fails is run again, twice at most. One that then passes is a flake: the build stays
      # green and the `build` job names it, so it is fixed rather than forgotten.
      # `test`, not `verify`: the coverage floors are for the whole suite, and one shard is a quarter of it.
      #
      # A hang names itself, as on the other lanes (scripts/dump-stuck-jvms.sh): the JVMs' threads are dumped at
      # 14 minutes (a shard takes about 7) and the step stops at 17, before the job's 20, so the steps below
      # still print the dump and upload it. The file stays under target/ with the shard's number: the artifact's
      # layout is what the `build` job merges.
      - name: Test
        timeout-minutes: 17
        shell: bash
        run: |
          scripts/dump-stuck-jvms.sh 840 target/jvm-dumps-shard-${{ matrix.shard }}.txt </dev/null >/dev/null 2>&1 &
          dumper=$!
          trap 'kill "$dumper" 2>/dev/null' EXIT
          ./mvnw -B --no-transfer-progress -Dspotless.check.skip=true -Dsurefire.rerunFailingTestsCount=2 -Dsurefire.includesFile=target/shard-includes.txt test

      - name: Thread dumps of a hung test run
        if: always()
        run: |
          dumps=target/jvm-dumps-shard-${{ matrix.shard }}.txt
          if [ -s "$dumps" ]; then cat "$dumps"; else echo "no hang"; fi

      # Also when the tests failed: the `build` job reports on all four shards, and the reports hold the
      # output and stack trace of a failed test. The coverage file gets the shard's number so that the
      # four can be downloaded into one directory.
      - name: Name this shard's coverage file
        if: always()
        run: |
          if [ -f target/jacoco.exec ]; then
            mv target/jacoco.exec target/jacoco-shard-${{ matrix.shard }}.exec
          fi

      - name: Upload test reports and coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-shard-${{ matrix.shard }}
          path: |
            target/jacoco-shard-*.exec
            target/surefire-reports
            target/jvm-dumps-shard-*.txt
          retention-days: 7
          if-no-files-found: ignore

  # The check master requires, under the name its ruleset knows. It runs no test: it waits for the four
  # shards, fails if any of them did, makes sure no test class fell between them, and applies the coverage
  # floors to their coverage put together.
  #
  # `!cancelled()`, not the default: by default a job is SKIPPED when one it needs has failed, and GitHub
  # counts a skipped required check as passed — a red shard would then let the pull request merge.
  build:
    name: Build & Test (JDK 25)
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config

      # Into target/: surefire-reports/ from all four shards (one file per test class, so they do not
      # collide) and jacoco-shard-N.exec from each.
      - name: Download the shards' reports and coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-shard-*
          path: target
          merge-multiple: true

      - name: Report flaky tests
        run: java scripts/ci/ReportFlakes.java target/surefire-reports >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when a shard failed
        if: needs.tests.result != 'success'
        run: |
          echo "::error::The test shards ended with '${{ needs.tests.result }}'. The failing shard's log names the test."
          exit 1

      # A list of includes replaces Surefire's own, so a class left off every list would stop running
      # without a word. This compares the reports with the test sources.
      - name: Check that every test class ran
        run: java scripts/ci/ShardTests.java check target/surefire-reports

      # A skip that is not on the allow-list means the runner lost something a test needs.
      - name: Check for unexpected skipped tests
        run: java scripts/ci/CheckSkips.java target/surefire-reports scripts/ci/expected-skips-linux.txt

      # A JaCoCo data file is a sequence of records and may hold several sessions, so the four are simply
      # joined. `-DskipTests` leaves compiling, the coverage report and the floors (`jacoco:check`).
      - name: Put the coverage together and apply the floors
        run: |
          cat target/jacoco-shard-*.exec > target/jacoco.exec
          ./mvnw -B --no-transfer-progress -DskipTests -Dspotless.check.skip=true verify

      - name: Summarise coverage
        run: |
          awk -F, 'NR == 1 { for (i = 1; i <= NF; i++) col[$i] = i; next }
            { lc += $col["LINE_COVERED"]; lm += $col["LINE_MISSED"]; bc += $col["BRANCH_COVERED"]; bm += $col["BRANCH_MISSED"] }
            END { print "### Coverage"; printf "Lines %.1f%% · branches %.1f%%\n", 100 * lc / (lc + lm), 100 * bc / (bc + bm) }' \
            target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 14

  # The CI, release and packaging scripts have their own unit tests (the shard lists, the release-asset
  # manifest, the tarball installer, the .deb maintainer scripts run against a scratch root, the
  # pinned-download check). They are `*Test.java` files beside the scripts, run by the JDK's source launcher
  # (scripts/lib/RunTests.java); nothing else runs them.
  scripts:
    name: Release & packaging scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in packaging/linux/postinst packaging/linux/postrm packaging/linux/tarball-install.sh; do
            sh -n "$script"
          done

      - name: Run script unit tests
        run: java scripts/lib/RunTests.java
