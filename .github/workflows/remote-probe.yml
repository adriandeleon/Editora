# Remote development against real SSH servers: RealSshdProbeFxTest drives every feature that runs on a host
# (Git, ripgrep, Run, kill, tunnels, the outside-change watch, pyright, jdtls with Java debugging, debugpy,
# js-debug, a frozen and a dropped connection, ed25519 keys) through Editora's own connection code, against a
# server started unprivileged on a high port of the runner itself:
#   - macOS's own OpenSSH (/usr/sbin/sshd), with a bash login shell and no setsid;
#   - dropbear on Linux, which leaves a command in its per-connection process's group (PosixShell's group
#     guard re-runs it under setsid).
#
# Not part of CI: it downloads the language servers and debuggers the probe needs and takes a while. Run it by
# hand (Actions → Remote probe → Run workflow), or push a `probe/**` branch.
name: Remote probe

on:
  workflow_dispatch:
  push:
    branches: ['probe/**']

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            server: sshd
            name: macos-15, the system's OpenSSH
          - os: ubuntu-latest
            server: dropbear
            name: ubuntu, dropbear

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config

      # What the probe runs on the host: the same pinned jdtls milestone and the same sources Editora's own
      # installer uses (InstallCatalog), so the probe sees what a user's Install button would give them.
      - name: Host tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tools"
          mkdir -p "$T/python" "$T/javascript" "$T/java-debug" "$T/jdtls"
          if ! command -v rg >/dev/null; then
            if command -v brew >/dev/null; then
              brew install ripgrep
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends ripgrep
            fi
          fi
          npm install -g pyright >/dev/null
          python3 -m pip install --quiet --target "$T/python" debugpy \
            || python3 -m pip install --quiet --break-system-packages --target "$T/python" debugpy
          version=$(sed -n 's/.*JDTLS_VERSION = "\(.*\)";/\1/p' src/main/java/com/editora/install/InstallCatalog.java)
          build=$(sed -n 's/.*JDTLS_BUILD = "\(.*\)";/\1/p' src/main/java/com/editora/install/InstallCatalog.java)
          curl -fsSL "https://download.eclipse.org/jdtls/milestones/$version/jdt-language-server-$version-$build.tar.gz" \
            | tar xz -C "$T/jdtls"
          vsix=$(curl -fsSL https://open-vsx.org/api/vscjava/vscode-java-debug/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["files"]["download"])')
          curl -fsSL "$vsix" -o "$T/java-debug.vsix"
          unzip -q -j "$T/java-debug.vsix" 'extension/server/com.microsoft.java.debug.plugin-*.jar' -d "$T/java-debug"
          dap=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/microsoft/vscode-js-debug/releases/latest \
            | python3 -c 'import json,sys; print(next(a["browser_download_url"] for a in json.load(sys.stdin)["assets"] if a["name"].startswith("js-debug-dap-v") and a["name"].endswith(".tar.gz")))')
          curl -fsSL "$dap" | tar xz -C "$T/javascript"
          ls "$T/java-debug" "$T/javascript" "$T/jdtls/bin"

      # The client's keys, and a login profile like a real user's (Homebrew's or npm's tools on PATH, a
      # JAVA_HOME): the job's own environment has them, an SSH login would not.
      - name: Keys and login profile
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/server"
          mkdir -p "$S/work"
          cd "$S"
          ssh-keygen -q -t ecdsa -N '' -f client_ecdsa
          ssh-keygen -q -t ed25519 -N '' -f client_ed25519
          cat client_ecdsa.pub client_ed25519.pub > authorized_keys
          chmod 600 authorized_keys
          profile="export PATH=\"$(dirname "$(command -v node)"):$(npm prefix -g)/bin:$(dirname "$(command -v rg)"):\$PATH\"
          export JAVA_HOME=\"$JAVA_HOME\""
          # A bash login reads the first of these it finds; zsh reads .zprofile.
          for f in .bash_profile .bash_login .profile; do
            if [ -f "$HOME/$f" ] || [ "$f" = .profile ]; then
              printf '%s\n' "$profile" >> "$HOME/$f"
              echo "profile: ~/$f"
              break
            fi
          done
          printf '%s\n' "$profile" >> ~/.zprofile

      # macOS: an unprivileged sshd can log in only the account it runs as.
      - name: Private sshd
        if: matrix.server == 'sshd'
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/server"
          cd "$S"
          ssh-keygen -q -t ed25519 -N '' -f host_ed25519
          ssh-keygen -q -t ecdsa -N '' -f host_ecdsa
          cat > sshd_config <<CFG
          Port 22522
          ListenAddress 127.0.0.1
          HostKey $S/host_ed25519
          HostKey $S/host_ecdsa
          PidFile $S/server.pid
          AuthorizedKeysFile $S/authorized_keys
          UsePAM no
          StrictModes no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          Subsystem sftp /usr/libexec/sftp-server
          AllowTcpForwarding yes
          MaxSessions 10
          LogLevel VERBOSE
          CFG
          /usr/sbin/sshd -t -f sshd_config
          /usr/sbin/sshd -f sshd_config -E "$S/server.log"
          echo "PROBE_PORT=22522" >> "$GITHUB_ENV"
          sw_vers
          ssh -V
          dscl . -read "/Users/$(id -un)" UserShell

      # Linux: dropbear from the distribution, unprivileged. Ubuntu's (2022.83) predates -D, so the keys go
      # where every dropbear looks, ~/.ssh/authorized_keys (a throwaway runner's); that folder and the home
      # above it must not be writable by group or others.
      - name: Private dropbear
        if: matrix.server == 'dropbear'
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/server"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dropbear-bin openssh-sftp-server
          dpkg-query -W dropbear-bin
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          chmod go-w "$HOME"
          cat "$S/authorized_keys" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          cd "$S"
          dropbearkey -t ed25519 -f host_ed25519 >/dev/null
          dropbearkey -t ecdsa -f host_ecdsa >/dev/null
          nohup dropbear -F -E -s -p 127.0.0.1:22523 -P "$S/server.pid" \
            -r "$S/host_ed25519" -r "$S/host_ecdsa" > "$S/server.log" 2>&1 &
          echo "PROBE_PORT=22523" >> "$GITHUB_ENV"
          getent passwd "$(id -un)" | cut -d: -f7

      - name: Log in once
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/server"
          for i in $(seq 20); do [ -s "$S/server.pid" ] && break; sleep 0.5; done
          echo "server pid $(cat "$S/server.pid")"
          ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$S/known_hosts" -o BatchMode=yes \
            -i "$S/client_ecdsa" -p "$PROBE_PORT" "$(id -un)@127.0.0.1" \
            'echo "login: $SHELL $HOME"; ps -o pid,ppid,pgid,sess,comm -p $$; for t in node rg pyright-langserver java python3 git setsid; do printf "%s: " $t; command -v $t || echo -; done'

      - name: Probe
        shell: bash
        env:
          PROBE_NAME: ${{ matrix.name }}
        run: |
          S="$RUNNER_TEMP/server"
          T="$RUNNER_TEMP/tools"
          ./mvnw -B --no-transfer-progress -Djacoco.skip=true -Dgroups=fx -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest=RealSshdProbeFxTest \
            -Dremote.probe="$(id -un)@127.0.0.1:$PROBE_PORT" \
            -Dremote.probe.key="$S/client_ecdsa" \
            -Dremote.probe.ed25519Key="$S/client_ed25519" \
            -Dremote.probe.dir="$S/work" \
            -Dremote.probe.sshdPid="$(cat "$S/server.pid")" \
            -Dremote.probe.jdtls="$T/jdtls/bin/jdtls" \
            -Dremote.probe.javaDebug="$(ls "$T"/java-debug/com.microsoft.java.debug.plugin-*.jar)" \
            -Dremote.probe.debugpy="$T/python" \
            -Dremote.probe.jsDebug="$T/javascript" \
            test | tee probe.log
          status=${PIPESTATUS[0]}
          { echo "### Probe report ($PROBE_NAME)"; echo '```'; sed -n '/PROBE REPORT/,/^\[/p' probe.log | sed '$d'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Server log
        if: always()
        shell: bash
        run: tail -n 200 "$RUNNER_TEMP/server/server.log" || true

  # A folder whose tools run in a container: ContainerProbeFxTest against Docker on the runner, with an image
  # that has a JDK and bash (the relay a port is reached through): commands in the mounted folder, the
  # container's own PATH, Stop, Run with stdin, a dev container found by its label, a port reached from here.
  container:
    name: Probe (ubuntu, a Docker container)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config

      - name: Image
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker pull --quiet eclipse-temurin:25-jdk

      # A Java debug session in the container: the same pinned jdtls milestone (mounted read-only; the image has
      # no python3 for its launcher script, so the probe mounts a sh one beside it) and the java-debug plugin,
      # which Editora copies into the container's cache.
      - name: Java tools
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tools"
          mkdir -p "$T/java-debug" "$T/jdtls"
          version=$(sed -n 's/.*JDTLS_VERSION = "\(.*\)";/\1/p' src/main/java/com/editora/install/InstallCatalog.java)
          build=$(sed -n 's/.*JDTLS_BUILD = "\(.*\)";/\1/p' src/main/java/com/editora/install/InstallCatalog.java)
          curl -fsSL "https://download.eclipse.org/jdtls/milestones/$version/jdt-language-server-$version-$build.tar.gz" \
            | tar xz -C "$T/jdtls"
          vsix=$(curl -fsSL https://open-vsx.org/api/vscjava/vscode-java-debug/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["files"]["download"])')
          curl -fsSL "$vsix" -o "$T/java-debug.vsix"
          unzip -q -j "$T/java-debug.vsix" 'extension/server/com.microsoft.java.debug.plugin-*.jar' -d "$T/java-debug"
          ls "$T/java-debug" "$T/jdtls/plugins" | grep -E 'java.debug.plugin|equinox.launcher_'

      - name: Probe
        shell: bash
        run: |
          ./mvnw -B --no-transfer-progress -Djacoco.skip=true -Dgroups=fx -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest=ContainerProbeFxTest \
            -Dcontainer.probe=docker \
            -Dcontainer.probe.image=eclipse-temurin:25-jdk \
            -Dcontainer.probe.jdtls="$RUNNER_TEMP/tools/jdtls" \
            -Dcontainer.probe.javaDebug="$(ls "$RUNNER_TEMP"/tools/java-debug/com.microsoft.java.debug.plugin-*.jar)" \
            test | tee probe.log
          status=${PIPESTATUS[0]}
          { echo '### Probe report (container)'; echo '```'; grep -E 'Tests run:|FAIL|ERROR\]|CONTAINER JAVA DEBUG' probe.log | head -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # A folder inside a WSL distribution, reached from Windows as \\wsl.localhost\…: WslProbeTest on a Windows
  # runner with a WSL 1 Ubuntu (hosted runners cannot run WSL 2): commands, git, Stop and a port, all inside;
  # WslWatchProbeTest: outside changes, watched inside the distribution (inotifywait and the poll).
  wsl:
    name: Probe (windows, WSL 1)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config

      - name: WSL
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1
          additional-packages: git python3 inotify-tools

      - name: Probe
        shell: bash
        run: |
          wsl.exe -l -v || true
          ./mvnw -B --no-transfer-progress -Djacoco.skip=true -DexcludedGroups=fx -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest='WslProbeTest,WslWatchProbeTest' -Dwsl.probe=Ubuntu-24.04 test
