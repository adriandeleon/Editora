name: Release

on:
  push:
    # Version-shaped tags only (vX.Y.Z, optionally with a suffix such as -rc1). A bare `v*` also fired on
    # tags like `vendor-import` or `v-test`, and everything downstream assumes the tag IS a version.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch: {}

# Read-only by default. Only the two jobs that publish (`release`) or push (`bump`) ask for more, in their
# own `permissions:` blocks; the build matrices run third-party actions and downloaded tools and must not
# hold a token that can write to the repository.
#
# Every action below is pinned to a full commit SHA with its version in a trailing comment (Dependabot
# keeps both in step, see .github/dependabot.yml). A tag such as `@v6` is mutable; a SHA is not.
permissions:
  contents: read

jobs:
  # Fails in seconds — before five build legs start — when the tag is not a
  # version or does not match the pom. Without it a `v1.2.3` tag pushed from a `1.2.3-SNAPSHOT` pom built
  # and published installers named 1.2.3 whose app reports 1.2.3-SNAPSHOT (and the post-release bump then
  # quietly did nothing). -rc tags are cut from the -SNAPSHOT line and are only checked for their shape; a
  # manual dispatch from a branch is not checked at all. See scripts/release/CheckRelease.java.
  #
  # It then refuses a commit that CI did not pass. The build legs run no tests (`-DskipTests`) and a tag
  # can be pushed on any commit, so before this a release could be cut from code whose required checks had
  # failed, or never ran. "Required" is whatever the master branch's ruleset requires, read from the API.
  # CI may still be running when the tag goes up straight after a merge, so on a tag it waits for up to 30
  # minutes; a failed check stops it at once. A manual dry run only reports.
  #
  # Last, the Full tests (full-tests.yml: Windows, macOS, the probes against real tools). Pull requests wait
  # only for the fast lane, so this is where those suites gate a release. The tagged commit is usually a fresh
  # merge with no run of its own, so the preflight starts one on the tag and waits up to an hour for it (the
  # macOS runners may be queued); a failed run stops it at once.
  preflight:
    name: Preflight (tag vs pom version, CI and Full tests passed)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      checks: read   # the check runs on the commit being released
      actions: write # list the Full tests runs on the commit, and start one when there is none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Check the tag against the pom version
        run: java scripts/release/CheckRelease.java version "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" pom.xml

      # If a required check failed for a reason that has nothing to do with the code (a runner lost, a
      # flaky test), re-run it on the commit and then re-run this workflow: the newest run of each check
      # decides.
      - name: Check that CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            java scripts/release/CheckRelease.java ci "$GITHUB_REPOSITORY" "$GITHUB_SHA" --mode enforce --wait-minutes 30
          else
            java scripts/release/CheckRelease.java ci "$GITHUB_REPOSITORY" "$GITHUB_SHA" --mode report
          fi

      # As above: if a job failed for an unrelated reason, re-run it (the log prints the command) and then
      # re-run this workflow's failed jobs. A dry run reports and starts nothing.
      - name: Check that the Full tests passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            java scripts/release/CheckRelease.java full "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME" --mode enforce --wait-minutes 60
          else
            java scripts/release/CheckRelease.java full "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME" --mode report
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    # A leg normally finishes in minutes; the cap only stops a hung AOT trainer or installer wrap from
    # holding a runner for the 6-hour default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64,     os: ubuntu-latest }
          - { target: linux-arm64,   os: ubuntu-24.04-arm }
          - { target: macos-x64,     os: macos-15-intel }
          # macos-15 (arm64), not macos-14: the macOS 14 images are retired on 2026-11-02, with brownouts
          # from 2026-10-05 (actions/runner-images#13518). This leg trains the AOT cache on the runner's
          # paravirtual GPU and EDITORA_REQUIRE_AOT=1 fails it if training regresses — and macos-15 has
          # never built a release. RUN A workflow_dispatch DRY RUN before the next tag (docs/release.md).
          - { target: macos-arm64,   os: macos-15 }
          - { target: windows-x64,   os: windows-latest }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: liberica
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config

      # Linux build deps:
      #  - xvfb + GTK/GL libs: the -Pdist build trains a full-GUI AOT cache (scripts/aot_build.java),
      #    and on a headless runner JavaFX needs a virtual X display; the helper auto-wraps training in
      #    xvfb-run when DISPLAY is unset. Best-effort — training degrades gracefully if it's missing.
      #  - rpm: provides rpmbuild so jpackage can build the .rpm (the Linux leg ships .deb AND .rpm).
      - name: Install Linux build deps (virtual display + rpmbuild)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libgl1 libxxf86vm1 rpm

      # macOS Developer ID signing: the .p12 (certificate + key + Apple's Developer ID G2 intermediate) goes
      # into a throw-away keychain, and the identity it holds is handed to the -Pdist build, where
      # scripts/aot_build.java signs the finished app and its DMG. The "Notarize DMG" step below then has
      # Apple notarize it and staples the ticket. How the secrets are made: docs/release.md.
      #
      # On a tag, missing secrets fail the leg: an unsigned DMG is exactly what this exists to stop shipping,
      # and the release is immutable once published. A manual dry run without them builds unsigned and says so.
      - name: Import signing certificate (macOS)
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error title=macOS signing secrets missing::MACOS_CERT_P12 / MACOS_CERT_PASSWORD are not set; refusing to release an unsigned DMG"
              exit 1
            fi
            echo "::warning title=macOS build unsigned::no signing secrets, so this dry run's DMG is ad-hoc signed and not notarized"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kc="$RUNNER_TEMP/editora-signing.keychain-db"
          kcpass="$(uuidgen)"
          security create-keychain -p "$kcpass" "$kc"
          # No auto-lock during the build (the default locks after 5 minutes of inactivity).
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          p12="$RUNNER_TEMP/editora-signing.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$p12"
          if ! security import "$p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign; then
            rm -f "$p12"
            echo "::error title=Certificate import failed::macOS could not open MACOS_CERT_P12 with MACOS_CERT_PASSWORD. Usually the password secret does not match the .p12 (re-set it at the gh prompt; a piped echo adds a newline); otherwise the .p12 was exported without openssl's -legacy"
            exit 1
          fi
          rm -f "$p12"
          # Lets codesign use the key without the GUI prompt a runner can never answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
          # Add it to the search list next to the login keychain, which codesign needs to build the chain.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            security find-identity -v -p codesigning "$kc"
            echo "::error title=No Developer ID identity::the imported .p12 holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "Signing as: $identity"
          {
            echo "EDITORA_MAC_SIGN_IDENTITY=$identity"
            echo "EDITORA_MAC_KEYCHAIN=$kc"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build native installer (-Pdist)
        shell: bash
        # `clean` is REQUIRED, not just tidiness: an incremental compile does not regenerate a synthetic
        # `$SwitchMap` inner class (e.g. KeyDispatcher$1 for an enum `switch`) that a prior/parallel build
        # or an IDE compiler left deleted in target/classes — javac sees the .java as up-to-date and skips
        # it. jlink then ships a jimage missing that class and the packaged app throws ClassNotFoundException
        # on the first keypress. A clean target/ guarantees every class is regenerated.
        env:
          # Names this leg in the AOT step's job-summary row and, if the cache is missing, in its error
          # annotation — so "which target shipped uncached?" is answerable from the run page.
          EDITORA_TARGET: ${{ matrix.target }}
          # A missing AOT cache FAILS this leg rather than only annotating it, so the release cannot publish
          # a silently ~28%-slower cold start. Armed after v0.12.1 trained on all five targets (72-73 MB
          # each) — the green tag the previous, deliberately-unarmed version of this comment was waiting
          # for. It stayed unarmed until then because macOS arm64 shipped uncached from v0.9.1 through
          # v0.9.8 (JavaFX 26's Metal pipeline aborting on that runner's paravirtual GPU) and the fix is
          # verifiable on no other machine, so arming it first risked blocking a release on an unproven fix.
          #
          # What it does when it fires: aot_build.java's reportNoCache exits 3, exec-maven-plugin turns that
          # into a BUILD FAILURE, this matrix leg fails, and the Release job (which `needs` the matrix) never
          # runs — so nothing is published, rather than a release where one platform is quietly slow. The
          # annotation names the target. Verified end to end before arming, including that exit 3 really does
          # fail Maven; the gate is worthless if it doesn't.
          #
          # If it ever fires on a legitimate release: the cache is a pure optimisation, so the fastest way
          # out is to set this back to '0' for that tag and fix the trainer afterwards — do NOT weaken
          # aot_build.java, whose whole job is to notice.
          EDITORA_REQUIRE_AOT: '1'
        run: ./mvnw -B --no-transfer-progress clean -Pdist -DskipTests package

      # Apple scans the signed DMG and, if it passes, issues a ticket; stapling attaches the ticket to the
      # DMG so Gatekeeper accepts it offline too. `--wait` usually returns in a few minutes. A rejection
      # prints Apple's log, which names each offending file. The checks at the end are what Gatekeeper does
      # on a user's Mac: the DMG and the app inside it must both be accepted as notarized Developer ID code.
      - name: Notarize DMG (macOS)
        if: steps.macsign.outputs.enabled == 'true'
        shell: bash
        timeout-minutes: 35
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "::error title=Notarization secrets missing::APPLE_API_KEY_P8 / APPLE_API_KEY_ID are not set"
            exit 1
          fi
          # Easy to mix up when copying them off the Integrations page: the issuer is a UUID shown above the
          # key list, the key ID is 10 characters in the key's row. Say which one is wrong before Apple does.
          uuid='^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
          if [ -n "$APPLE_API_ISSUER" ] && ! [[ "$APPLE_API_ISSUER" =~ $uuid ]]; then
            echo "::error title=APPLE_API_ISSUER is not an issuer ID::it must be the UUID shown as Issuer ID above the team key list (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)"
            exit 1
          fi
          if ! [[ "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error title=APPLE_API_KEY_ID is not a key ID::it must be the 10-character Key ID from the key's row"
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          # A team key needs the issuer; an individual key has none.
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID")
          [ -n "$APPLE_API_ISSUER" ] && auth+=(--issuer "$APPLE_API_ISSUER")

          dmg="$(ls target/dist/*.dmg | head -1)"
          # The app INSIDE the DMG must still carry our signature, intact: jpackage re-signs an image it
          # believes unsigned, ad hoc, and anything the wrap changes in the bundle breaks the seal. Checking
          # here takes seconds and names the changed file; Apple takes minutes to say only "invalid".
          pre="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$pre" "$dmg" > /dev/null
          if ! codesign -dv --verbose=2 "$pre"/*.app 2>&1 | grep -q '^Authority=Developer ID Application'; then
            codesign -dv --verbose=2 "$pre"/*.app || true
            hdiutil detach "$pre" > /dev/null || true
            echo "::error title=DMG app not Developer ID signed::the app inside $(basename "$dmg") lost its Developer ID signature during the DMG wrap"
            exit 1
          fi
          if ! codesign --verify --deep --strict --verbose=4 "$pre"/*.app; then
            hdiutil detach "$pre" > /dev/null || true
            echo "::error title=DMG app signature broken::the app inside $(basename "$dmg") no longer verifies; the codesign output above names what changed"
            exit 1
          fi
          hdiutil detach "$pre" > /dev/null
          echo "Notarizing $dmg"
          out="$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 30m --output-format json)" || true
          echo "$out"
          id="$(printf '%s' "$out" | jq -r '.id // empty')"
          status="$(printf '%s' "$out" | jq -r '.status // empty')"
          if [ -n "$id" ]; then
            xcrun notarytool log "$id" "${auth[@]}" || true
          fi
          rm -f "$key"
          if [ "$status" != "Accepted" ]; then
            echo "::error title=Notarization failed::Apple returned '${status:-no result}' for $(basename "$dmg"); the log above lists the problems"
            exit 1
          fi

          # Stapling fetches the ticket from Apple's CDN and validates it in the same call ("The staple and
          # validate action worked!"). That fetch can drop (error 68 on dry run 41182099691, minutes after
          # an Accepted), and the ticket sometimes takes a moment to publish, so retry it.
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple "$dmg" && break
            [ "$attempt" = 5 ] && { echo "::error title=Stapling failed::notarized, but the ticket could not be stapled"; exit 1; }
            sleep 20
          done
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          trap 'hdiutil detach "$mnt" > /dev/null 2>&1 || true' EXIT
          app="$(ls -d "$mnt"/*.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          echo "- ✅ ${{ matrix.target }}: signed, notarized and stapled" >> "$GITHUB_STEP_SUMMARY"

      # Portable single-file Linux build from the AOT-trained app-image (no sandbox — host tools work;
      # see scripts/build-appimage.sh). Runs before staging so the .AppImage is picked up from target/dist.
      # Best-effort ONLY on a manual dry run. On a tag a failure fails this leg: the .AppImage is part of
      # the release, the Release job's asset check refuses to publish without it, and failing here lets
      # "Re-run failed jobs" rebuild just this leg. (It used to be continue-on-error always, which let a
      # network hiccup publish an immutable release with the AppImage missing for good.)
      # x64 only — on Linux ARM we ship just the tar.gz + jar (no .deb/.rpm/.AppImage).
      - name: Build AppImage (Linux)
        if: matrix.target == 'linux-x64'
        continue-on-error: ${{ github.event_name != 'push' }}
        shell: bash
        run: scripts/build-appimage.sh target/aot-image/Editora branding/editora.png target/dist

      # Portable extract-and-install tarball from the same AOT-trained app-image (see
      # scripts/build-tarball.sh): a jlink runtime + native bin/Editora launcher + a bundled install.sh
      # that installs to /opt/editora (root) or ~/.local/editora (user) with an `editora` command + menu
      # entry. The extract-and-install counterpart to the .AppImage — no jpackage installer, no FUSE.
      # Best-effort only on a manual dry run, for the same reason as the AppImage step above.
      - name: Build install tarball (Linux)
        if: runner.os == 'Linux'
        continue-on-error: ${{ github.event_name != 'push' }}
        shell: bash
        run: scripts/build-tarball.sh target/aot-image/Editora target/dist

      # Runnable fat jar for this runner's platform (JavaFX natives are host-specific, so each
      # runner produces its own jar — a single all-platforms jar isn't possible, see pom.xml).
      # Skipped for macOS (both arches) — those targets ship only the .dmg.
      - name: Build fat jar (-Pfatjar)
        if: ${{ !startsWith(matrix.target, 'macos-') }}
        shell: bash
        run: ./mvnw -B --no-transfer-progress -Pfatjar -DskipTests package

      # Tag pushes use the tag (minus the leading v); manual runs fall back to the pom version.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>(.+)<\/version>.*/\1/')"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # jpackage names DMG/MSI without a version/arch, so disambiguate per target before releasing.
      # (The fat jar already carries the version, e.g. Editora-<version>-<target>.jar.)
      - name: Stage artifacts
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p staging
          for f in target/dist/*; do
            [ -f "$f" ] || continue
            # Preserve compound extensions (.tar.gz) so the artifact isn't named "...-linux-x64.gz".
            case "$f" in
              *.tar.gz) ext="tar.gz" ;;
              *)        ext="${f##*.}" ;;
            esac
            # Linux ARM ships only the tarball (+ jar) — drop the .deb/.rpm installers that -Pdist
            # produced (the .AppImage was skipped upstream).
            if [ "${{ matrix.target }}" = "linux-arm64" ]; then
              case "$ext" in
                deb|rpm|AppImage) continue ;;
              esac
            fi
            cp "$f" "staging/Editora-${VERSION}-${{ matrix.target }}.${ext}"
          done
          # The fat jar isn't built for macOS (see the -Pfatjar step's condition), so guard the copy.
          # The `|| true` is required: GitHub's `shell: bash` runs with `set -eo pipefail`, so a no-match
          # `ls` (macOS: no jar) would abort the whole step before the `-n` guard below could skip it.
          jar="$(ls target/Editora-*.jar 2>/dev/null | head -1 || true)"
          if [ -n "$jar" ]; then
            cp "$jar" "staging/$(basename "$jar" .jar)-${{ matrix.target }}.jar"
          fi

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Editora-${{ steps.ver.outputs.version }}-${{ matrix.target }}
          path: staging/*
          if-no-files-found: error

      # The runner is ephemeral, but the keychain holds the private key, so remove it as soon as we're done.
      - name: Remove signing keychain (macOS)
        if: always() && steps.macsign.outputs.enabled == 'true'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/editora-signing.keychain-db" || true

  # These portable archives are best-effort on each host platform. A target is
  # uploaded only after its extracted payload passes the real app workflow.
  # Failure is visible on the run but never suppresses the established JVM release.
  native-experimental:
    name: Experimental Native Image (${{ matrix.target }})
    # Disabled for now: in the v0.20.0 release every target failed (linux-x64 ran native-image out of
    # heap) and macos-arm64 was cancelled at the timeout. Delete this line, and add the job back to the
    # release job's `needs`, to bring it back.
    if: false
    needs: preflight
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64,   os: ubuntu-24.04,   graal: '25.0.4', gc: G1,     heap: 6g, workers: 4 }
          # Oracle GraalVM 25.0.1 is the last JDK 25 build for Intel macOS.
          - { target: macos-x64,   os: macos-15-intel, graal: '25',     gc: serial, heap: 6g, workers: 4 }
          # Standard Apple Silicon runners have only 7 GiB RAM / 3 vCPUs. macos-15 for the same reason as
          # the build leg above (macos-14 is retired on 2026-11-02); unverified until a dry run.
          - { target: macos-arm64, os: macos-15,       graal: '25.0.4', gc: serial, heap: 5g, workers: 2 }
          - { target: windows-x64, os: windows-latest, graal: '25.0.4', gc: serial, heap: 6g, workers: 4 }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GraalVM for JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: ${{ matrix.graal }}
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config

      - name: Install Linux Native Image build and GUI test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev \
            libgtk-3-dev libxtst-dev libxxf86vm-dev libgl1-mesa-dev xvfb xauth

      # The experiment peaked at 14 GiB with unrestricted parallelism. Bound
      # heap/workers; preserve every profile safety flag because -DbuildArgs
      # replaces the full Maven argument list. G1 is unavailable on these JDK 25
      # macOS/Windows builds, so use Serial GC there.
      - name: Build Native Image
        shell: bash
        env:
          NATIVE_GC: ${{ matrix.gc }}
          NATIVE_HEAP: ${{ matrix.heap }}
          NATIVE_WORKERS: ${{ matrix.workers }}
        run: |
          ./mvnw -B --no-transfer-progress clean -Pnative -DskipTests \
            "-DbuildArgs=--exact-reachability-metadata,--future-defaults=run-time-initialize-file-system-providers,-march=compatibility,--gc=${NATIVE_GC},-H:+AddAllCharsets,-Djfx.static.gui=false,-J-Xmx${NATIVE_HEAP},--parallelism=${NATIVE_WORKERS}" package

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>(.+)<\/version>.*/\1/')"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Package experimental archive
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          binary=target/editora-native
          if [ "$RUNNER_OS" = Windows ]; then binary="${binary}.exe"; fi
          java scripts/nativeimage/PackageRelease.java "$binary" "$VERSION" "$TARGET" staging

      # Extract and test the exact payload that would be released. Keep its
      # disposable project outside the checkout: repository .editorconfig can
      # alter saved bytes and invalidate the exact-content/history oracle.
      - name: Smoke test packaged native application (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          xvfb-run -a java scripts/nativeimage/SmokeRelease.java \
            "staging/Editora-${VERSION}-${TARGET}-native-experimental.tar.gz" \
            "$TARGET" "$RUNNER_TEMP/editora-native-release-smoke"

      - name: Smoke test packaged native application (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          ext=tar.gz
          if [ "$RUNNER_OS" = Windows ]; then ext=zip; fi
          java scripts/nativeimage/SmokeRelease.java \
            "staging/Editora-${VERSION}-${TARGET}-native-experimental.${ext}" \
            "$TARGET" "$RUNNER_TEMP/editora-native-release-smoke"

      - name: Upload native smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-smoke-diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/editora-native-release-smoke/probe
            ${{ runner.temp }}/editora-native-release-smoke/warn-probe
          if-no-files-found: ignore

      # Keep a failed-smoke build downloadable for device testing without
      # matching JReleaser's release globs. Rename the .candidate suffix after
      # download to extract it locally.
      - name: Stage unqualified native candidate
        if: failure()
        shell: bash
        run: |
          for file in staging/*; do
            [ -f "$file" ] || continue
            cp "$file" "$file.candidate"
          done

      - name: Upload unqualified native candidate
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-unqualified-${{ matrix.target }}
          path: staging/*.candidate
          if-no-files-found: ignore

      - name: Upload experimental native build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Editora-${{ steps.ver.outputs.version }}-${{ matrix.target }}-native-experimental
          path: staging/*
          if-no-files-found: error

  release:
    name: Release
    # native-experimental is left out of `needs` while it is disabled. With it in the chain, a cancelled
    # or skipped Native Image leg also skipped the `bump` job below, so master was not reopened after
    # v0.19.0 and v0.20.0.
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # JReleaser talks to the GitHub API with JRELEASER_GITHUB_TOKEN and only READS the local history
      # (for the changelog); nothing here pushes with git, so the token is not left in .git/config.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>(.+)<\/version>.*/\1/')"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # JReleaser rejects immutable snapshot releases even for --dry-run.
          # Manual dispatch validates using the upcoming plain version; the
          # artifacts retain their actual -SNAPSHOT build identity.
          echo "release_version=${v%-SNAPSHOT}" >> "$GITHUB_OUTPUT"

      # The last gate before an IMMUTABLE release. A green build matrix does not prove every installer
      # exists: aot_build.java lets the .rpm succeed alone when the .deb wrap fails, the Stage step copies
      # whatever it finds, and jreleaser.yml's globs accept zero matches — so without this a release could
      # publish with an installer missing and no way to add it afterwards. On a tag this fails the job and
      # names every missing file; a manual dispatch only reports, so a dry run still reaches JReleaser
      # (read the step's output: every line must say `ok`).
      # The expected set lives in scripts/release/CheckRelease.java (unit-tested there).
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify the expected release assets
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mode=report
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then mode=enforce; fi
          java scripts/release/CheckRelease.java assets artifacts "$VERSION" --pom pom.xml --mode "$mode"

      - name: JReleaser
        # No `v2` TAG exists upstream — `@v2` was a branch. Pinned to that branch's head as of 2026-10-01
        # (newest tagged release: 2.5.0).
        uses: jreleaser/release-action@97b5e2f0e845de2fe1dbbdf451ac6a21233fafff # v2
        with:
          # The JReleaser the action downloads. The default is `latest`, i.e. whatever was published
          # most recently on the day of the release; pin it and bump deliberately.
          version: 1.26.0
          # Real tag pushes publish; manual runs only validate (dry run).
          arguments: ${{ github.event_name == 'workflow_dispatch' && 'release --dry-run' || 'full-release' }}
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.ver.outputs.release_version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JReleaser logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jreleaser-output
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
          if-no-files-found: ignore

  # Reopen master for development: after a real release, put the pom back on the NEXT patch with a
  # -SNAPSHOT suffix, so anything built off master until the next release identifies itself as a
  # development build (AppInfo.isSnapshot() -> the toolbar badge, About, --version).
  #
  # master requires the "Build & Test" and "Format" checks, so a direct push is refused (GH013, as on
  # v0.21.0). The job pushes the one-line change to a `chore/reopen-X.Y.Z` branch and opens a pull
  # request instead. Two things the default GITHUB_TOKEN does not do by itself:
  #   - A pull request it opens triggers no `pull_request` workflow, so the required checks would never
  #     report. The job dispatches CI on the branch (ci.yml has `workflow_dispatch`); those runs report
  #     the same check names on the same commit.
  #   - It may open a pull request only when Settings → Actions → General → "Allow GitHub Actions to
  #     create and approve pull requests" is on. When it is off the branch is still pushed and the job
  #     summary carries the link that opens the pull request in one click.
  # The release is already published by the time this runs.
  #
  # Deliberately skipped for pre-releases (vX.Y.Z-rcN): an rc is cut from the -SNAPSHOT line and must
  # not advance it. Also skipped on workflow_dispatch, which is only ever a dry run.
  bump:
    name: Reopen master for development
    needs: release
    if: github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push the chore/reopen-X.Y.Z branch
      pull-requests: write   # open the pull request
      actions: write         # dispatch CI on the branch
    steps:
      # The one checkout that keeps its credentials: this job pushes the version bump branch.
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open the pull request that bumps the pom to the next -SNAPSHOT
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          released="${GITHUB_REF_NAME#v}"
          current="$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>(.+)<\/version>.*/\1/')"

          # Idempotence guard: only advance when master still sits on the version we just released.
          # Anything else (already a -SNAPSHOT, or moved on) means a human got there first — leave it.
          if [ "$current" != "$released" ]; then
            echo "master pom is '$current', not the released '$released' — nothing to bump."
            exit 0
          fi

          # Next patch. A released version is always plain X.Y.Z here (the tag drives it).
          IFS='.' read -r major minor patch <<< "$released"
          next_release="${major}.${minor}.$((patch + 1))"
          next="${next_release}-SNAPSHOT"
          branch="chore/reopen-${next_release}"
          title="chore: reopen master at ${next} after ${GITHUB_REF_NAME}"

          # A re-run of this job finds the branch it pushed the first time.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists — nothing to do."
            exit 0
          fi

          # Replace only the FIRST <version> — the project's own, before any dependency/plugin ones.
          sed -i -E "0,/<version>${released}<\/version>/s//<version>${next}<\/version>/" pom.xml
          grep -m1 '<version>' pom.xml

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add pom.xml
          git commit -m "$title"
          git push origin "$branch"

          # The required checks, on the commit just pushed.
          gh workflow run ci.yml --ref "$branch"

          body="${GITHUB_REF_NAME} is published. This reopens \`master\` for development: \`pom.xml\` ${released} → ${next}."
          if url="$(gh pr create --base master --head "$branch" --title "$title" --body "$body")"; then
            echo "Opened $url"
            echo "Merge [the pull request]($url) to reopen master at \`${next}\`." >> "$GITHUB_STEP_SUMMARY"

            # Opening the PR also queues pull_request runs, which GitHub holds ("action_required") because the
            # Actions bot opened it: CI, plus every other workflow with a pull_request trigger that matches
            # (Terminal image for pom.xml, Full tests). The PR counts the held CI run as its CI and so sees
            # none of the dispatched checks above: it stays blocked until that run is approved (v0.22.0,
            # #1223). Approving only the first held run is not enough (v0.23.0, #1296: it approved Full tests
            # and left CI held), so approve every held run on the commit, and keep polling until CI's held run
            # has been seen and one more pass finds nothing new, or until the attempts run out.
            sha="$(git rev-parse HEAD)"
            tried=" "        # run ids already approved or refused, space-separated
            failed=()        # "id<TAB>workflow" of every refused approval
            ci_seen=""
            for _ in $(seq 1 24); do
              held="$(gh run list --branch "$branch" --event pull_request --limit 50 \
                --json databaseId,headSha,conclusion,workflowName \
                --jq ".[] | select(.headSha == \"$sha\" and .conclusion == \"action_required\") | \"\(.databaseId)\t\(.workflowName)\"")"
              new=""
              while IFS=$'\t' read -r id workflow; do
                [ -n "$id" ] || continue
                case "$tried" in *" $id "*) continue ;; esac
                tried+="$id "
                new=1
                [ "$workflow" = "CI" ] && ci_seen=1
                if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" >/dev/null </dev/null; then
                  echo "Approved the held pull_request run ${id} (${workflow})."
                else
                  failed+=("${id}"$'\t'"${workflow}")
                fi
              done <<< "$held"
              [ -n "$ci_seen" ] && [ -z "$new" ] && break
              sleep 5
            done
            if [ "$tried" = " " ]; then
              echo "No held pull_request run on $sha — the dispatched checks stand."
            elif [ -z "$ci_seen" ]; then
              echo "::warning::No held CI run appeared on $sha; if the PR shows a held CI run, approve it by hand."
            fi
            if [ "${#failed[@]}" -gt 0 ]; then
              echo "::warning::Could not approve ${#failed[@]} held pull_request run(s); the PR stays blocked until they are approved."
              echo "Approve the held runs first:" >> "$GITHUB_STEP_SUMMARY"
              for entry in "${failed[@]}"; do
                IFS=$'\t' read -r id workflow <<< "$entry"
                echo "Approve it by hand: gh api -X POST repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve  # ${workflow}"
                echo "- ${workflow}: \`gh api -X POST repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve\`" >> "$GITHUB_STEP_SUMMARY"
              done
            fi
          else
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/master...${branch}?expand=1"
            echo "::warning::Could not open the pull request (is \"Allow GitHub Actions to create and approve pull requests\" off?). Branch ${branch} is pushed; open it at ${compare}"
            echo "The branch \`${branch}\` is pushed but the pull request could not be opened. [Open it](${compare}) and merge it to reopen master at \`${next}\`." >> "$GITHUB_STEP_SUMMARY"
          fi
