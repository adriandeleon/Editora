name: Release

on:
  push:
    # Version-shaped tags only (vX.Y.Z, optionally with a suffix such as -rc1). A bare `v*` also fired on
    # tags like `vendor-import` or `v-test`, and everything downstream assumes the tag IS a version.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch: {}

# Read-only by default. Only the two jobs that publish (`release`) or push (`bump`) ask for more, in their
# own `permissions:` blocks; the build matrices run third-party actions and downloaded tools and must not
# hold a token that can write to the repository.
#
# Every action below is pinned to a full commit SHA with its version in a trailing comment (Dependabot
# keeps both in step, see .github/dependabot.yml). A tag such as `@v6` is mutable; a SHA is not.
permissions:
  contents: read

jobs:
  # Fails in seconds — before five build legs and four Native Image builds start — when the tag is not a
  # version or does not match the pom. Without it a `v1.2.3` tag pushed from a `1.2.3-SNAPSHOT` pom built
  # and published installers named 1.2.3 whose app reports 1.2.3-SNAPSHOT (and the post-release bump then
  # quietly did nothing). -rc tags are cut from the -SNAPSHOT line and are only checked for their shape; a
  # manual dispatch from a branch is not checked at all. See scripts/release/check-release.py.
  preflight:
    name: Preflight (tag vs pom version)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against the pom version
        run: python3 scripts/release/check-release.py version "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" pom.xml

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    # A leg normally finishes in minutes; the cap only stops a hung AOT trainer or installer wrap from
    # holding a runner for the 6-hour default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64,     os: ubuntu-latest }
          - { target: linux-arm64,   os: ubuntu-24.04-arm }
          - { target: macos-x64,     os: macos-15-intel }
          # macos-15 (arm64), not macos-14: the macOS 14 images are retired on 2026-11-02, with brownouts
          # from 2026-10-05 (actions/runner-images#13518). This leg trains the AOT cache on the runner's
          # paravirtual GPU and EDITORA_REQUIRE_AOT=1 fails it if training regresses — and macos-15 has
          # never built a release. RUN A workflow_dispatch DRY RUN before the next tag (docs/release.md).
          - { target: macos-arm64,   os: macos-15 }
          - { target: windows-x64,   os: windows-latest }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: liberica
          java-version: '25'
          cache: maven

      # Linux build deps:
      #  - xvfb + GTK/GL libs: the -Pdist build trains a full-GUI AOT cache (scripts/aot_build.java),
      #    and on a headless runner JavaFX needs a virtual X display; the helper auto-wraps training in
      #    xvfb-run when DISPLAY is unset. Best-effort — training degrades gracefully if it's missing.
      #  - rpm: provides rpmbuild so jpackage can build the .rpm (the Linux leg ships .deb AND .rpm).
      - name: Install Linux build deps (virtual display + rpmbuild)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libgl1 libxxf86vm1 rpm

      - name: Build native installer (-Pdist)
        shell: bash
        # `clean` is REQUIRED, not just tidiness: an incremental compile does not regenerate a synthetic
        # `$SwitchMap` inner class (e.g. KeyDispatcher$1 for an enum `switch`) that a prior/parallel build
        # or an IDE compiler left deleted in target/classes — javac sees the .java as up-to-date and skips
        # it. jlink then ships a jimage missing that class and the packaged app throws ClassNotFoundException
        # on the first keypress. A clean target/ guarantees every class is regenerated.
        env:
          # Names this leg in the AOT step's job-summary row and, if the cache is missing, in its error
          # annotation — so "which target shipped uncached?" is answerable from the run page.
          EDITORA_TARGET: ${{ matrix.target }}
          # A missing AOT cache FAILS this leg rather than only annotating it, so the release cannot publish
          # a silently ~28%-slower cold start. Armed after v0.12.1 trained on all five targets (72-73 MB
          # each) — the green tag the previous, deliberately-unarmed version of this comment was waiting
          # for. It stayed unarmed until then because macOS arm64 shipped uncached from v0.9.1 through
          # v0.9.8 (JavaFX 26's Metal pipeline aborting on that runner's paravirtual GPU) and the fix is
          # verifiable on no other machine, so arming it first risked blocking a release on an unproven fix.
          #
          # What it does when it fires: aot_build.java's reportNoCache exits 3, exec-maven-plugin turns that
          # into a BUILD FAILURE, this matrix leg fails, and the Release job (which `needs` the matrix) never
          # runs — so nothing is published, rather than a release where one platform is quietly slow. The
          # annotation names the target. Verified end to end before arming, including that exit 3 really does
          # fail Maven; the gate is worthless if it doesn't.
          #
          # If it ever fires on a legitimate release: the cache is a pure optimisation, so the fastest way
          # out is to set this back to '0' for that tag and fix the trainer afterwards — do NOT weaken
          # aot_build.java, whose whole job is to notice.
          EDITORA_REQUIRE_AOT: '1'
        run: ./mvnw -B --no-transfer-progress clean -Pdist -DskipTests package

      # Portable single-file Linux build from the AOT-trained app-image (no sandbox — host tools work;
      # see scripts/build-appimage.sh). Runs before staging so the .AppImage is picked up from target/dist.
      # Best-effort ONLY on a manual dry run. On a tag a failure fails this leg: the .AppImage is part of
      # the release, the Release job's asset check refuses to publish without it, and failing here lets
      # "Re-run failed jobs" rebuild just this leg. (It used to be continue-on-error always, which let a
      # network hiccup publish an immutable release with the AppImage missing for good.)
      # x64 only — on Linux ARM we ship just the tar.gz + jar (no .deb/.rpm/.AppImage).
      - name: Build AppImage (Linux)
        if: matrix.target == 'linux-x64'
        continue-on-error: ${{ github.event_name != 'push' }}
        shell: bash
        run: scripts/build-appimage.sh target/aot-image/Editora branding/editora.png target/dist

      # Portable extract-and-install tarball from the same AOT-trained app-image (see
      # scripts/build-tarball.sh): a jlink runtime + native bin/Editora launcher + a bundled install.sh
      # that installs to /opt/editora (root) or ~/.local/editora (user) with an `editora` command + menu
      # entry. The extract-and-install counterpart to the .AppImage — no jpackage installer, no FUSE.
      # Best-effort only on a manual dry run, for the same reason as the AppImage step above.
      - name: Build install tarball (Linux)
        if: runner.os == 'Linux'
        continue-on-error: ${{ github.event_name != 'push' }}
        shell: bash
        run: scripts/build-tarball.sh target/aot-image/Editora target/dist

      # Runnable fat jar for this runner's platform (JavaFX natives are host-specific, so each
      # runner produces its own jar — a single all-platforms jar isn't possible, see pom.xml).
      # Skipped for macOS (both arches) — those targets ship only the .dmg.
      - name: Build fat jar (-Pfatjar)
        if: ${{ !startsWith(matrix.target, 'macos-') }}
        shell: bash
        run: ./mvnw -B --no-transfer-progress -Pfatjar -DskipTests package

      # Tag pushes use the tag (minus the leading v); manual runs fall back to the pom version.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>(.+)<\/version>.*/\1/')"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # jpackage names DMG/MSI without a version/arch, so disambiguate per target before releasing.
      # (The fat jar already carries the version, e.g. Editora-<version>-<target>.jar.)
      - name: Stage artifacts
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p staging
          for f in target/dist/*; do
            [ -f "$f" ] || continue
            # Preserve compound extensions (.tar.gz) so the artifact isn't named "...-linux-x64.gz".
            case "$f" in
              *.tar.gz) ext="tar.gz" ;;
              *)        ext="${f##*.}" ;;
            esac
            # Linux ARM ships only the tarball (+ jar) — drop the .deb/.rpm installers that -Pdist
            # produced (the .AppImage was skipped upstream).
            if [ "${{ matrix.target }}" = "linux-arm64" ]; then
              case "$ext" in
                deb|rpm|AppImage) continue ;;
              esac
            fi
            cp "$f" "staging/Editora-${VERSION}-${{ matrix.target }}.${ext}"
          done
          # The fat jar isn't built for macOS (see the -Pfatjar step's condition), so guard the copy.
          # The `|| true` is required: GitHub's `shell: bash` runs with `set -eo pipefail`, so a no-match
          # `ls` (macOS: no jar) would abort the whole step before the `-n` guard below could skip it.
          jar="$(ls target/Editora-*.jar 2>/dev/null | head -1 || true)"
          if [ -n "$jar" ]; then
            cp "$jar" "staging/$(basename "$jar" .jar)-${{ matrix.target }}.jar"
          fi

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Editora-${{ steps.ver.outputs.version }}-${{ matrix.target }}
          path: staging/*
          if-no-files-found: error

  # These portable archives are best-effort on each host platform. A target is
  # uploaded only after its extracted payload passes the real app workflow.
  # Failure is visible on the run but never suppresses the established JVM release.
  native-experimental:
    name: Experimental Native Image (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64,   os: ubuntu-24.04,   graal: '25.0.4', gc: G1,     heap: 6g, workers: 4 }
          # Oracle GraalVM 25.0.1 is the last JDK 25 build for Intel macOS.
          - { target: macos-x64,   os: macos-15-intel, graal: '25',     gc: serial, heap: 6g, workers: 4 }
          # Standard Apple Silicon runners have only 7 GiB RAM / 3 vCPUs. macos-15 for the same reason as
          # the build leg above (macos-14 is retired on 2026-11-02); unverified until a dry run.
          - { target: macos-arm64, os: macos-15,       graal: '25.0.4', gc: serial, heap: 5g, workers: 2 }
          - { target: windows-x64, os: windows-latest, graal: '25.0.4', gc: serial, heap: 6g, workers: 4 }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GraalVM for JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: ${{ matrix.graal }}
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Set up Python for packaging and smoke test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Linux Native Image build and GUI test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev \
            libgtk-3-dev libxtst-dev libxxf86vm-dev libgl1-mesa-dev xvfb xauth

      # The experiment peaked at 14 GiB with unrestricted parallelism. Bound
      # heap/workers; preserve every profile safety flag because -DbuildArgs
      # replaces the full Maven argument list. G1 is unavailable on these JDK 25
      # macOS/Windows builds, so use Serial GC there.
      - name: Build Native Image
        shell: bash
        env:
          NATIVE_GC: ${{ matrix.gc }}
          NATIVE_HEAP: ${{ matrix.heap }}
          NATIVE_WORKERS: ${{ matrix.workers }}
        run: |
          ./mvnw -B --no-transfer-progress clean -Pnative -DskipTests \
            "-DbuildArgs=--exact-reachability-metadata,--future-defaults=run-time-initialize-file-system-providers,-march=compatibility,--gc=${NATIVE_GC},-H:+AddAllCharsets,-Djfx.static.gui=false,-J-Xmx${NATIVE_HEAP},--parallelism=${NATIVE_WORKERS}" package

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>(.+)<\/version>.*/\1/')"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Package experimental archive
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          binary=target/editora-native
          if [ "$RUNNER_OS" = Windows ]; then binary="${binary}.exe"; fi
          python scripts/native/package-release.py "$binary" "$VERSION" "$TARGET" staging

      # Extract and test the exact payload that would be released. Keep its
      # disposable project outside the checkout: repository .editorconfig can
      # alter saved bytes and invalidate the exact-content/history oracle.
      - name: Smoke test packaged native application (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          xvfb-run -a python scripts/native/smoke-release.py \
            "staging/Editora-${VERSION}-${TARGET}-native-experimental.tar.gz" \
            "$TARGET" "$RUNNER_TEMP/editora-native-release-smoke"

      - name: Smoke test packaged native application (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          ext=tar.gz
          if [ "$RUNNER_OS" = Windows ]; then ext=zip; fi
          python scripts/native/smoke-release.py \
            "staging/Editora-${VERSION}-${TARGET}-native-experimental.${ext}" \
            "$TARGET" "$RUNNER_TEMP/editora-native-release-smoke"

      - name: Upload native smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-smoke-diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/editora-native-release-smoke/probe
            ${{ runner.temp }}/editora-native-release-smoke/warn-probe
          if-no-files-found: ignore

      # Keep a failed-smoke build downloadable for device testing without
      # matching JReleaser's release globs. Rename the .candidate suffix after
      # download to extract it locally.
      - name: Stage unqualified native candidate
        if: failure()
        shell: bash
        run: |
          for file in staging/*; do
            [ -f "$file" ] || continue
            cp "$file" "$file.candidate"
          done

      - name: Upload unqualified native candidate
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-unqualified-${{ matrix.target }}
          path: staging/*.candidate
          if-no-files-found: ignore

      - name: Upload experimental native build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Editora-${{ steps.ver.outputs.version }}-${{ matrix.target }}-native-experimental
          path: staging/*
          if-no-files-found: error

  release:
    name: Release
    needs: [build, native-experimental]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # JReleaser talks to the GitHub API with JRELEASER_GITHUB_TOKEN and only READS the local history
      # (for the changelog); nothing here pushes with git, so the token is not left in .git/config.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>(.+)<\/version>.*/\1/')"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # JReleaser rejects immutable snapshot releases even for --dry-run.
          # Manual dispatch validates using the upcoming plain version; the
          # artifacts retain their actual -SNAPSHOT build identity.
          echo "release_version=${v%-SNAPSHOT}" >> "$GITHUB_OUTPUT"

      # The last gate before an IMMUTABLE release. A green build matrix does not prove every installer
      # exists: aot_build.java lets the .rpm succeed alone when the .deb wrap fails, the Stage step copies
      # whatever it finds, and jreleaser.yml's globs accept zero matches — so without this a release could
      # publish with an installer missing and no way to add it afterwards. On a tag this fails the job and
      # names every missing file; a manual dispatch only reports, so a dry run still reaches JReleaser
      # (read the step's output: every line must say `ok`).
      # The expected set lives in scripts/release/check-release.py (unit-tested there).
      - name: Verify the expected release assets
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mode=report
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then mode=enforce; fi
          python3 scripts/release/check-release.py assets artifacts "$VERSION" --pom pom.xml --mode "$mode"

      - name: JReleaser
        # No `v2` TAG exists upstream — `@v2` was a branch. Pinned to that branch's head as of 2026-10-01
        # (newest tagged release: 2.5.0).
        uses: jreleaser/release-action@97b5e2f0e845de2fe1dbbdf451ac6a21233fafff # v2
        with:
          # The JReleaser the action downloads. The default is `latest`, i.e. whatever was published
          # most recently on the day of the release; pin it and bump deliberately.
          version: 1.26.0
          # Real tag pushes publish; manual runs only validate (dry run).
          arguments: ${{ github.event_name == 'workflow_dispatch' && 'release --dry-run' || 'full-release' }}
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.ver.outputs.release_version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JReleaser logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jreleaser-output
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
          if-no-files-found: ignore

  # Reopen master for development: after a real release, put the pom back on the NEXT patch with a
  # -SNAPSHOT suffix, so anything built off master until the next release identifies itself as a
  # development build (AppInfo.isSnapshot() -> the toolbar badge, About, --version).
  #
  # Deliberately skipped for pre-releases (vX.Y.Z-rcN): an rc is cut from the -SNAPSHOT line and must
  # not advance it. Also skipped on workflow_dispatch, which is only ever a dry run.
  bump:
    name: Reopen master for development
    needs: release
    if: github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The one checkout that keeps its credentials: this job pushes the version bump.
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          # Default GITHUB_TOKEN; if master is branch-protected, swap in a PAT with bypass rights.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump pom to the next -SNAPSHOT
        shell: bash
        run: |
          set -euo pipefail
          released="${GITHUB_REF_NAME#v}"
          current="$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>(.+)<\/version>.*/\1/')"

          # Idempotence guard: only advance when master still sits on the version we just released.
          # Anything else (already a -SNAPSHOT, or moved on) means a human got there first — leave it.
          if [ "$current" != "$released" ]; then
            echo "master pom is '$current', not the released '$released' — nothing to bump."
            exit 0
          fi

          # Next patch. A released version is always plain X.Y.Z here (the tag drives it).
          IFS='.' read -r major minor patch <<< "$released"
          next="${major}.${minor}.$((patch + 1))-SNAPSHOT"

          # Replace only the FIRST <version> — the project's own, before any dependency/plugin ones.
          sed -i -E "0,/<version>${released}<\/version>/s//<version>${next}<\/version>/" pom.xml
          grep -m1 '<version>' pom.xml

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml
          git commit -m "chore: reopen master at ${next} after ${GITHUB_REF_NAME}"
          git push origin HEAD:master
