; A small INI sample for syntax highlighting.
; Covers sections, both separators, quoted values, and both comment styles.

[server]
host = localhost
port = 8080
debug = false

[paths]
data_dir = /var/lib/sample
log_file = "C:\Program Files\Sample\app.log"

# A hash comment.
[logging]
level: info
format = %(asctime)s %(levelname)s %(message)s

[section.with.dots]
empty =
key with spaces = value with spaces
