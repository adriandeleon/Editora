<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget</title>
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <!-- Open this in the HTML live preview, then edit widget.css or widget.js and watch it reload.
         "Go: Related File" cycles between widget.html, widget.css and widget.js. -->
    <main class="widget">
      <h1>Counter</h1>
      <p class="count" id="count" aria-live="polite">0</p>
      <div class="buttons">
        <button type="button" data-step="-1">&minus;</button>
        <button type="button" data-step="1">+</button>
        <button type="button" data-reset>Reset</button>
      </div>
    </main>
    <script src="widget.js"></script>
  </body>
</html>
