# Windows file associations for the MSI (jpackage --file-associations).
#
# What this buys: Editora appears under Explorer's right-click "Open with" for every extension below,
# which on Windows and Linux is the ONLY way a file manager can hand a file to an editor — those
# platforms deliver the path as argv, and nothing registers that mapping unless the installer does.
#
# It does NOT hijack your existing defaults. On Windows 8+ the shell's per-user UserChoice wins over
# anything an installer writes, so a type you already open with something else keeps opening with it;
# Editora is simply offered alongside. An extension nothing else claims does fall to Editora, which is
# the wanted outcome for the likes of .tfvars or .gvy.
#
# The list is every extension LanguageRegistry actually resolves to a language — MINUS html/htm/xhtml
# and svg. That exclusion is not arbitrary: it mirrors the policy already decided for the Linux .deb
# (see packaging/linux/postinst), where text/html and image/svg+xml are left to the browser and the
# image viewer. One policy, two platforms, so the two installers cannot drift apart in what they claim.
# WindowsFileAssociationsTest keeps the list honest — every extension here must still resolve to a real
# language, so the file cannot rot into claiming types Editora no longer understands.
#
# Deliberately ONE association rather than one per language: each --file-associations file becomes a
# separate ProgId and a separate "Open with" entry, and 120 near-identical entries would be noise.
#
# mime-type is required by jpackage's parser and is only cosmetic here (Windows keys off the extension);
# text/plain is the honest umbrella for "a text file Editora can edit".
mime-type=text/plain
description=Text or source file
extension=automount bash bat c cc cfg cjs cmd conf cpp cs css csv csx cts cxx ddl desktop device diff directory dml dockerfile dot fxml gemspec go gql gradle graphql graphqls groovy gv gvy h hcl hh hpp http hxx ini iuml java js json json5 jsonc jsx just kt kts link log lua mak make markdown markwhen md mdown mermaid mjs mk mkd mmd mount mts mw netdev network nspawn patch path php php3 php4 php5 phps phtml plantuml pom properties proto ps1 psm1 pu puml py pyi pyw rake rb rest rs rss scope service sh slice socket sql swap target tf tfvars timer tml toml ts tsv tsx typ wsdl xml xsd xsl xslt yaml yml zsh
