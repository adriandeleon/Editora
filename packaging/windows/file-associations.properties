# Windows file associations for the MSI (jpackage --file-associations).
#
# What this buys: Editora appears under Explorer's right-click "Open with" for every extension below,
# which on Windows and Linux is the ONLY way a file manager can hand a file to an editor — those
# platforms deliver the path as argv, and nothing registers that mapping unless the installer does.
#
# What it costs, stated plainly because this file used to claim the opposite: jpackage does not add
# Editora to an "Open with" list, it REGISTERS EACH EXTENSION'S CLASS machine-wide — it writes
# HKLM\Software\Classes\.<ext> to point at Editora's own ProgId, and the MSI removes that key again on
# uninstall. A type the user has explicitly chosen an app for (the per-user UserChoice, which an
# installer cannot write) keeps opening with that app. A type with NO per-user choice falls to
# Editora on double-click, even if another program's machine-wide class owned it before, and is left
# with no class at all after an uninstall. That is the wanted outcome for the likes of .tfvars or .gvy,
# which nothing else claims; it is NOT acceptable for a type whose normal action is to RUN the file.
#
# So the extensions that Windows (or a common interpreter's installer) executes on double-click are
# deliberately NOT listed: bat, cmd (cmd.exe), js (Windows Script Host), ps1, psm1 (PowerShell),
# py, pyw (the Python launcher), rb (RubyInstaller) and sh (Git for Windows' bash). Listing them would
# turn "double-click runs my script" into "double-click opens an editor" for every user of the machine,
# and break the type on uninstall. Editora still edits and highlights all of them — open them from
# inside the editor, from a terminal, or through "Open with > Choose another app". Never add jse, vbs,
# vbe, wsf, wsh, hta, reg, pl or any other run-on-open type either; WindowsFileAssociationsTest
# enforces the whole set.
#
# The rest of the list is every extension LanguageRegistry resolves to a language — MINUS html/htm/
# xhtml and svg, which mirror the policy already decided for the Linux .deb (see packaging/linux/
# postinst), where text/html and image/svg+xml are left to the browser and the image viewer — PLUS txt,
# first. The order matters: jpackage registers the FIRST extension as the system's default extension
# for the mime-type below (HKCR\MIME\Database\Content Type\text/plain), so with the list sorted
# alphabetically Windows was told that text/plain content is an ".automount" file. txt is the only
# entry that does not resolve to a language, and the only one that may.
#
# NOT DEVICE-TESTED. The behaviour above is read from how jpackage emits its WiX source; confirm on a
# Windows machine (install, double-click a .bat and a .txt, uninstall, double-click again) before
# relying on it. If a claimed type turns out to be taken over where it should not be, the real fix is
# to register through OpenWithProgids instead of the extension's default class, which needs a custom
# WiX fragment rather than this file.
#
# Deliberately ONE association rather than one per language: each --file-associations file becomes a
# separate association group with its own description, and a hundred near-identical ones would be noise.
#
# mime-type is required by jpackage's parser; text/plain is the honest umbrella for "a text file
# Editora can edit".
mime-type=text/plain
description=Text or source file
extension=txt automount bash c cc cfg cjs conf cpp cs css csv csx cts cxx ddl desktop device diff directory dml dockerfile dot fxml gemspec go gql gradle graphql graphqls groovy gv gvy h hcl hh hpp http hxx ini iuml java json json5 jsonc jsx just kt kts link log lua mak make markdown markwhen md mdown mermaid mjs mk mkd mmd mount mts mw netdev network nspawn patch path php php3 php4 php5 phps phtml plantuml pom properties proto pu puml pyi rake rest rs rss scope service slice socket sql swap target tf tfvars timer tml toml ts tsv tsx typ wsdl xml xsd xsl xslt yaml yml zsh
