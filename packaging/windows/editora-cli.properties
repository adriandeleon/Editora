# The console launcher, editora-cli.exe, added beside Editora.exe in the Windows app image
# (jpackage --add-launcher, wired in pom.xml's os-windows profile).
#
# Why a second launcher: a Windows program is either a console program or a GUI one, fixed in the .exe.
# Editora.exe is a GUI program — a console one would open a console window behind the editor on every
# launch, and closing it would kill Editora — so its output goes nowhere and a shell does not wait for it.
# editora-cli.exe is the same application (same runtime, module, Java options and AOT cache, all inherited
# from the main launcher) built as a console program: `editora-cli http api.http`, `editora-cli --version`
# and `editora-cli --help` print in the terminal, and the shell gets the exit status.
#
# The name cannot be `editora.exe`: Windows file names ignore case, so it would be Editora.exe.
win-console=true
