# JReleaser configuration — creates the GitHub release and attaches the per-platform installers
# that the release workflow builds (one runner per OS/arch). The version is supplied at release time
# via the JRELEASER_PROJECT_VERSION env var (derived from the git tag); see .github/workflows/release.yml.
project:
  name: editora
  description: A keyboard-driven, cross-platform programmer's text editor.
  authors:
    - Adrian De Leon
  license: MIT
  links:
    # The Homebrew cask's and the winget manifest's homepage: the website, not the repository.
    homepage: https://editora-project.dev
  inceptionYear: "2026"
  # Read from the project, not from the packager: tags set under winget: are not picked up.
  tags:
    - text-editor
    - code-editor
    - ide
    - javafx
  # An application rather than a command-line tool: what makes brew write a cask, not a formula.
  stereotype: DESKTOP
  java:
    groupId: com.editora
    version: 25

release:
  github:
    owner: adriandeleon
    name: Editora
    # JReleaser defaults to "main" when unset; this repo's default branch is "master" — without this,
    # the release job fails with "Could not checkout branch main".
    branch: master
    tagName: 'v{{projectVersion}}'
    releaseName: 'Editora {{projectVersion}}'
    # GitHub's Immutable Releases (GA Oct 2025) reject asset uploads once a release is published, so
    # JReleaser's default create-then-upload-loop flow 422s on every asset ("Cannot upload assets to an
    # immutable release"). This makes JReleaser create the release as a draft, upload every asset while
    # it's still a (mutable) draft, then publish — the flow GitHub's own docs prescribe for immutable repos.
    # Mutually exclusive with `overwrite` (JReleaser itself rejects the combination: an immutable release
    # can't be overwritten by definition) — a re-run on the same tag now needs the prior release deleted
    # first (`gh release delete v<version>`), not overwritten in place.
    immutableRelease: true
    # Tags like v1.0.0-rc1 are published as pre-releases.
    prerelease:
      pattern: '.*-rc.*'
    # The notes are written, not generated from the commits: the install text (.github/release-notes.md), then
    # this version's section of CHANGELOG.md, put here by scripts/release/ReleaseNotes.java in release.yml's
    # release job. The Welcome page's What's New opens this release, so they are what a user reads about it.
    changelog:
      external: out/release-notes.md

# The package managers (Pauta REL-12, REL-13). A Homebrew cask takes exactly one artifact, so macOS and
# Windows are two distributions: the cask serves Apple Silicon, and Intel Macs download the macos-x64 DMG.
# Both packagers push to another repository, which the workflow's own token cannot do: release.yml passes
# PACKAGES_TOKEN (a classic token with repo scope) and leaves both packagers out while it is unset (REL-14).
# continueOnError: a token problem costs the package-manager update, never the release.
#
# The paths name the files download-artifact puts under ./artifacts/<artifact name>/. EDITORA_BUILD_VERSION
# is the version in those names: the tag's on a release, the pom's -SNAPSHOT on a dry run, where the
# project version has the suffix stripped (release.yml). A distribution's file is attached to the release
# like the ones in `files`, so `files` leaves these two out: listed in both, JReleaser uploads the file
# once but writes it into checksums_sha256.txt twice. The cask template is src/jreleaser/ (no
# `auto_updates`, Apple Silicon only); EDITORA_MSI_PRODUCT_CODE is the MSI's own ProductCode, which
# release.yml reads from the file.
#
# Check the cask and the manifests without releasing: docs/release.md, "Homebrew and winget".
distributions:
  editora:
    type: NATIVE_PACKAGE
    artifacts:
      - path: 'artifacts/Editora-{{Env.EDITORA_BUILD_VERSION}}-macos-arm64/Editora-{{Env.EDITORA_BUILD_VERSION}}-macos-arm64.dmg'
        platform: osx-aarch_64
    brew:
      active: RELEASE
      continueOnError: true
      # The tap is shared by the family and has a README of its own; JReleaser's stock one, written over
      # it on every release, describes formulae the tap does not have.
      skipTemplates:
        - README.md.tpl
      cask:
        enabled: true
        name: editora
        displayName: Editora
        appName: Editora.app
      repository:
        active: RELEASE
        owner: adriandeleon
        name: homebrew-tap
        branch: main
        branchPush: main

  editora-windows:
    type: NATIVE_PACKAGE
    # winget's `Commands`: the console launcher the MSI puts on the PATH.
    executable:
      name: editora-cli
      windowsExtension: exe
    artifacts:
      - path: 'artifacts/Editora-{{Env.EDITORA_BUILD_VERSION}}-windows-x64/Editora-{{Env.EDITORA_BUILD_VERSION}}-windows-x64.msi'
        platform: windows-x86_64
    winget:
      active: RELEASE
      continueOnError: true
      package:
        identifier: AdrianDeLeon.Editora
        name: Editora
        version: '{{projectVersion}}'
        url: https://github.com/adriandeleon/Editora
      publisher:
        name: Adrian De Leon
        url: https://github.com/adriandeleon
        supportUrl: https://github.com/adriandeleon/Editora/issues
      moniker: editora
      installer:
        type: MSI
        # The MSI installs per machine (aot_build.java passes no per-user option).
        scope: MACHINE
        upgradeBehavior: INSTALL
      # How winget finds an installed Editora to upgrade or remove; jpackage makes a new one per version.
      productCode: '{{Env.EDITORA_MSI_PRODUCT_CODE}}'
      # JReleaser copies the project's LICENSE into every packager's repository; in the winget fork that
      # would replace Microsoft's own, and the pull request would carry it.
      extraProperties:
        skipLicenseFile: true
      # A fork of microsoft/winget-pkgs under this account. JReleaser only pushes the manifests to the
      # branch below; release.yml's "Open the winget pull request" step opens the pull request from it.
      repository:
        active: RELEASE
        owner: adriandeleon
        name: winget-pkgs
        branch: master
        branchPush: 'editora-{{projectVersion}}'

# Attach every other artifact gathered from the build matrix (downloaded under ./artifacts): native installers
# (the Intel .dmg, .deb, .rpm; the Apple Silicon .dmg and the .msi come from the distributions above), the portable Linux builds (.AppImage single-file + .tar.gz extract-and-install),
# the experimental Native Image archives (only while release.yml's native-experimental job is on; it is
# disabled, so that glob matches nothing), and per-platform runnable fat jars. All are named
# per target in CI, so names are unique across OS/arch. Each Linux download has its OpenPGP signature
# beside it (release.yml, sign-linux), and editora-signing-key.asc, the key that made them, is attached
# too.
files:
  globs:
    - pattern: 'artifacts/**/*-macos-x64.dmg'
    - pattern: 'artifacts/**/*.deb'
    - pattern: 'artifacts/**/*.rpm'
    - pattern: 'artifacts/**/*.AppImage'
    - pattern: 'artifacts/**/*.tar.gz'
    - pattern: 'artifacts/**/Editora-*-native-experimental.zip'
    - pattern: 'artifacts/**/Editora-*.jar'
    - pattern: 'artifacts/**/*.asc'
