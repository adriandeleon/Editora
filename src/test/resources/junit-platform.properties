# Suite-wide JUnit Platform configuration (read from the test classpath by the launcher).

# No test, and no @BeforeAll/@BeforeEach/@AfterEach/@AfterAll method, may run longer than this. A test that
# waits forever would otherwise hold its CI job until the job's own limit (30 minutes) kills it, and the log
# then ends without naming the test. The slowest whole test CLASS in CI takes about a minute, so five minutes
# for one method is far outside anything that is merely slow.
#
# The timeout interrupts the thread running the test; it does not abandon it. A test stuck in a wait that
# ignores interruption is reported once it returns, not before.
#
# A probe that is meant to run longer (the opt-in @Tag("probe") soaks) carries its own @Timeout, which wins.
junit.jupiter.execution.timeout.default = 5 m

# A breakpoint is not a hang: no timeouts while a debugger is attached.
junit.jupiter.execution.timeout.mode = disabled_on_debug
