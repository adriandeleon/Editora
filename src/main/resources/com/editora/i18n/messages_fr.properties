dialog.abortOperation.action=Abandonner : {0}
dialog.abortOperation.merge=Abandonner la fusion ? Toutes les résolutions de conflits et toute autre modification faite depuis son début sont perdues ; la branche, l’index et l’arbre de travail reviennent à leur état d’avant la fusion. Cette action est irréversible.
dialog.abortOperation.rebase=Abandonner le rebase ? Les commits déjà rejoués, toutes les résolutions de conflits et toute autre modification faite depuis son début sont perdus ; la branche revient là où elle était avant le rebase. Cette action est irréversible.
dialog.abortOperation.cherryPick=Abandonner le cherry-pick ? Toutes les résolutions de conflits et toute autre modification faite depuis son début sont perdues, ainsi que les commits déjà repris ; la branche revient là où elle était. Cette action est irréversible.
dialog.abortOperation.revert=Abandonner le revert ? Toutes les résolutions de conflits et toute autre modification faite depuis son début sont perdues, ainsi que les commits déjà annulés ; la branche revient là où elle était. Cette action est irréversible.
dialog.skipOperation.title={0} : ignorer le commit
dialog.skipOperation.message={0} : ignorer le commit sur lequel l’opération s’est arrêtée ? Ce commit est laissé de côté et tout ce qui a été résolu ou modifié depuis l’arrêt est abandonné. Cette action est irréversible.
dialog.skipOperation.action=Ignorer le commit
dialog.stageConflict.title=Conflit non résolu
