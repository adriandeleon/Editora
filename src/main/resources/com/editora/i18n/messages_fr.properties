git.auth.hint.https=Git n'a pas pu s'authentifier en HTTPS, et Editora ne demande jamais de mot de passe. Configurez un assistant d'identification (git config --global credential.helper …) — pour GitHub, exécutez : gh auth setup-git — ou utilisez un dépôt distant SSH, puis réessayez.
git.auth.hint.ssh=Le serveur n'a accepté aucune de vos clés SSH. Vérifiez qu'un agent SSH est lancé et contient votre clé (ssh-add -l ; ajoutez-la avec ssh-add) et que la clé publique est enregistrée auprès du dépôt distant. Editora ne peut pas demander la phrase secrète d'une clé.
git.auth.hint.hostKey=SSH ne connaît pas la clé d'hôte de ce serveur et Editora ne peut pas demander s'il faut lui faire confiance. Connectez-vous une fois à l'hôte depuis un terminal (par exemple : ssh -T git@github.com), vérifiez et acceptez sa clé, puis réessayez.
