dialog.hostKey.content=Editora ne s''est jamais connecté à {0}.\n\nEmpreinte de la clé {1} :\n{2}\n\nComparez cette empreinte à celle du serveur. Si elle ne correspond pas, quelqu''un intercepte peut-être la connexion : annulez et ne saisissez pas votre mot de passe.\n\nSe connecter enregistre la clé dans ~/.ssh/known_hosts ; la question ne sera plus posée et vous serez averti si elle change.
