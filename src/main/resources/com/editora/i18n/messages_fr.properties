dialog.mcp.enableBody=L'activation du serveur MCP démarre un point de terminaison HTTP local (lié à 127.0.0.1 uniquement) qui permet à un agent IA de lire et modifier vos fichiers ouverts, de les enregistrer sur le disque, de consulter les diagnostics, les résultats de recherche et l'état Git, et d'exécuter des commandes de l'éditeur en votre nom. Les connexions nécessitent un jeton secret, mais tout programme exécuté sur cet ordinateur pourrait tenter de l'utiliser. N'activez cette option que si vous comprenez et acceptez le risque.
dialog.trust.title=Confiance de l'espace de travail — avis de sécurité
dialog.trust.header=Exécuter les tâches de build depuis le dossier {0} ?
dialog.trust.body=Ce dossier fournit lui-même un script de build ({0}), et lancer une tâche de build exécuterait ce script avec vos privilèges : il peut lire, modifier ou supprimer vos fichiers et accéder au réseau. Ne faites confiance à ce dossier que si vous faites confiance à la provenance de son contenu.\n\n{1}\n\nLa confiance est mémorisée pour ce dossier et pour ses sous-dossiers. Vous pouvez la révoquer plus tard dans les Paramètres, sous Espace de travail.
dialog.trust.accept=Faire confiance au dossier et exécuter
dialog.lsp.trust.header=Utiliser les serveurs de langage choisis par le dossier {0} ?
dialog.lsp.trust.body=Le fichier .editora/settings.json de ce dossier choisit des programmes à lancer comme serveurs de langage. Ils s’exécuteraient avec vos privilèges : ils peuvent lire, modifier ou supprimer vos fichiers et accéder au réseau. Ne faites confiance à ce dossier que si vous faites confiance à la provenance de son contenu.\n\n{0}\n\n{1}\n\nLa confiance est mémorisée pour ce dossier et pour ses sous-dossiers. Vous pouvez la révoquer plus tard dans les Paramètres, sous Espace de travail.
dialog.lsp.trust.accept=Faire confiance au dossier

