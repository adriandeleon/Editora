dialog.pullDiverged.message=Votre branche et son amont ont chacune des commits que l’autre n’a pas ; une avance rapide est donc impossible.\n\nRebase rejoue vos commits par-dessus ceux du distant. Fusionner réunit les deux historiques par un commit de fusion.\n\nPour toujours tirer de cette façon, choisissez un mode de pull dans Paramètres → Git.
