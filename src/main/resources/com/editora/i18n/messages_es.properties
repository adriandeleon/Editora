dialog.abortOperation.merge=¿Abortar la fusión? Se pierden todas las resoluciones de conflictos y cualquier otro cambio hecho desde que empezó; la rama, el índice y el árbol de trabajo vuelven a como estaban antes de la fusión. Esto no se puede deshacer.
dialog.abortOperation.rebase=¿Abortar el rebase? Se pierden los commits ya reaplicados, todas las resoluciones de conflictos y cualquier otro cambio hecho desde que empezó; la rama vuelve a donde estaba antes del rebase. Esto no se puede deshacer.
dialog.abortOperation.cherryPick=¿Abortar el cherry-pick? Se pierden todas las resoluciones de conflictos y cualquier otro cambio hecho desde que empezó, junto con los commits que ya aplicó; la rama vuelve a donde estaba. Esto no se puede deshacer.
dialog.abortOperation.revert=¿Abortar el revert? Se pierden todas las resoluciones de conflictos y cualquier otro cambio hecho desde que empezó, junto con los commits que ya revirtió; la rama vuelve a donde estaba. Esto no se puede deshacer.
dialog.skipOperation.title={0}: omitir commit
