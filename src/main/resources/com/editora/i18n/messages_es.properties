git.auth.hint.https=Git no pudo iniciar sesión por HTTPS, y Editora nunca pide una contraseña. Configure un asistente de credenciales (git config --global credential.helper …) — para GitHub, ejecute: gh auth setup-git — o use un remoto SSH y vuelva a intentarlo.
git.auth.hint.ssh=El servidor no aceptó ninguna de sus claves SSH. Compruebe que hay un agente SSH en ejecución con su clave (ssh-add -l; añádala con ssh-add) y que la clave pública está registrada en el remoto. Editora no puede pedir la frase de paso de una clave.
git.auth.hint.hostKey=SSH no conoce la clave de host de este servidor y Editora no puede preguntar si confiar en ella. Conéctese al host una vez desde un terminal (por ejemplo: ssh -T git@github.com), verifique y acepte su clave, y vuelva a intentarlo.
