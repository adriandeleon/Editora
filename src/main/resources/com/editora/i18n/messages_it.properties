status.save.cannotEncodeSurrogate={0} non è stato salvato: la riga {1} contiene metà di un carattere ({2}), che nessuna codifica può memorizzare. Eliminala, o annulla la modifica che ha diviso il carattere.
status.mixedLineEndings={0} ha fine riga misti. Salvandolo senza modifiche restano come sono; salvando una modifica viene scritto {1} su ogni riga.
status.mixedLineEndingsBinary={0} mescola i fine riga e contiene dati binari. Salvandolo senza modifiche ogni byte resta com''è; salvare una modifica riscriverebbe ogni interruzione di riga come {1}, e prima viene chiesta conferma.
status.charsetAssumedMixed={0} non è {1} valido: aperto come {2}. Ha anche fine riga misti: salvandolo senza modifiche ogni byte resta com''è; salvando una modifica viene scritto {3} su ogni riga.
status.charsetAssumedMixedBinary={0} non è {1} valido: aperto come {2}. Mescola i fine riga e contiene dati binari: salvandolo senza modifiche ogni byte resta com''è; salvare una modifica riscriverebbe ogni interruzione di riga come {3}, e prima viene chiesta conferma.
status.save.cannotSaveMixedBinary={0} non è stato salvato: mescola i fine riga e contiene dati binari, e salvare questa modifica riscriverebbe ogni interruzione di riga come {1}. Annulla la modifica, oppure usa «{2}» per scriverne una copia.
