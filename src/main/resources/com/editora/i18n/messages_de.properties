dialog.httpTrust.header=Geheimnisse aus dem Ordner {0} senden?
dialog.httpTrust.body=Diese Anfrage liest Werte von außerhalb der .http-Datei — {0} — und sendet sie an {1}. Eine .http-Datei aus einem geklonten Repository kann so Ihre Umgebungsvariablen oder .env-Geheimnisse an einen beliebigen Server senden.\n\n{2}\n\nDas Vertrauen wird für diesen Ordner und die darin enthaltenen Ordner gespeichert und erlaubt auch das Ausführen seiner Build-Skripte. Sie können es später in den Einstellungen unter Arbeitsbereich widerrufen.
dialog.httpTrust.accept=Ordner vertrauen und senden
dialog.httpScripts.header=Skripte aus dem Ordner {0} ausführen?
dialog.httpScripts.body={0} enthält JavaScript-Skripte zur Antwortverarbeitung oder vor der Anfrage. Beim Ausführen läuft Code aus diesem Ordner auf Ihrem Node.js: Er kann die Antworten und die Variablen der Umgebung lesen und Netzwerkanfragen stellen. Eine .http-Datei aus einem geklonten Repository kann so das Gelesene an einen beliebigen Ort senden. Editora startet Node.js ohne Ihre Umgebungsvariablen und ab Node.js 20 ohne Schreibzugriff auf Dateien und ohne Kindprozesse.\n\n{1}\n\nDas Vertrauen wird für diesen Ordner und die darin enthaltenen Ordner gespeichert, erlaubt auch das Ausführen seiner Build-Skripte und lässt seine Anfragen Geheimnisse lesen. Sie können es später in den Einstellungen unter Arbeitsbereich widerrufen.
dialog.httpScripts.accept=Ordner vertrauen und ausführen
dialog.saveResponse.title=HTTP-Antwort speichern
settings.httpClient.enable=HTTP-Client aktivieren (.http-Dateien ausführen)
settings.httpClient.hint=Führe .http/.rest-Anfragen mit dem integrierten HTTP-Client von Editora aus — klicke auf das ▶ neben einer Anfrage oder nutze die Befehle „Anfrage ausführen“ und „Alle Anfragen ausführen“ (die Palette zeigt ihre Tasten). Die letzten Antworten jeder Datei werden im Konfigurationsordner gespeichert, Anmeldedaten-Header maskiert; eine Anfrage, die Umgebungsgeheimnisse liest, fragt zuerst, wenn ihr Ordner nicht vertrauenswürdig ist. Umgebungsdateien (http-client.env.json) und Variablen in der Datei werden unterstützt.
settings.httpClient.scripts=JavaScript-Skripte zur Antwortverarbeitung und vor der Anfrage ausführen
settings.httpClient.scriptsHint=Führt auf Node.js die Skripte vor der Anfrage (< {% … %}, < ./sign.js) einer Anfrage aus, bevor sie gesendet wird, und ihre Skripte zur Antwortverarbeitung (> {% … %}, > ./check.js), sobald ihre Antwort eingetroffen ist: Ergebnisse von client.test erscheinen im Block „Tests“, Werte von request.variables.set verwendet die Anfrage selbst, und Werte von client.global verwenden spätere Anfragen als {{name}}. Nur aus vertrauenswürdigen Ordnern; Node.js erhält keine Umgebungsvariablen und kann ab Node.js 20 weder Dateien schreiben noch Prozesse starten. Zeilen mit # @assert und # @capture funktionieren ohne Node.js.
settings.httpClient.inlineResults=Ergebnisse hinter jeder Anfragezeile anzeigen
settings.httpClient.inlineResultsHint=Nach einer Anfrage zeigt ihre Zeile im Editor, wie sie ausging — Status, Dauer und fehlgeschlagene Tests —, und ihr ▶ nimmt die Farbe des Ergebnisses an. Ein Klick auf das Ergebnis zeigt diese Antwort. Die Ergebnisse stammen aus dem Antwortverlauf und sind daher nach dem erneuten Öffnen der Datei wieder da.
settings.httpClient.nodePath=Node.js für HTTP-Skripte
settings.httpClient.nodePathHint=Leer lassen, um das unter Debuggen → JavaScript festgelegte Node.js zu verwenden (sonst eine von nvm installierte .nvmrc-Version, sonst node aus dem PATH).
settings.httpClient.scriptTimeout=Zeitlimit für Skripte (Sekunden)
settings.httpClient.scriptTimeoutHint=Ein Skript, das nach dieser Zeit noch läuft, wird gestoppt.
