status.lsp.tsNoSdk=Der TypeScript-/JavaScript-Sprachserver wurde nicht gestartet: Er braucht TypeScript 5 oder 6 neben sich. Verwende „Installieren“ auf seiner Karte in den Einstellungen oder führe npm install -g typescript@6 aus.
status.lsp.tsSdkWithoutTsserver=Der TypeScript-/JavaScript-Sprachserver wurde nicht gestartet: Das TypeScript {0} neben ihm hat keinen tsserver (TypeScript 7 ist der native Compiler). Verwende „Installieren“ auf seiner Karte in den Einstellungen oder führe npm install -g typescript@6 aus.
status.lsp.tsSdkUntrusted=Der TypeScript-/JavaScript-Sprachserver wurde nicht gestartet: Das einzige TypeScript ist das eigene dieses Ordners, und dem Ordner wird nicht vertraut, es auszuführen. Führe „{0}“ aus oder installiere TypeScript 6 neben dem Server.
status.lsp.javaTooOld={0} benötigt Java {1} oder neuer und es wurde keines gefunden. Installieren Sie ein JDK {1} oder neuer oder wählen Sie eines als Standard-JDK in den Einstellungen (Build-Tools).
status.lsp.nodeTypesHint=Die Node.js-APIs haben in diesem Ordner keine Typen, daher kennen Hover und Vervollständigung sie nicht. Füge sie mit npm install --save-dev @types/node hinzu.
doctor.tip.typescriptSdkMissing=Neben typescript-language-server liegt kein TypeScript, daher startet er nur in einem vertrauenswürdigen Ordner mit eigenem TypeScript. Klicke auf „Aktualisieren…“ (installiert TypeScript 6) oder führe npm install -g typescript@6 aus.
doctor.tip.typescriptSdkWithoutTsserver=Das TypeScript {0} neben typescript-language-server hat keinen tsserver (TypeScript 7 ist der native Compiler), daher kann der Server nicht starten. Klicke auf „Aktualisieren…“ (installiert TypeScript 6) oder führe npm install -g typescript@6 aus.
