# Encrypted files (ADR 0017)
command.crypto.encryptFile=Verschlüsselung: Datei verschlüsseln…
command.crypto.encryptFile.desc=Verschlüsselt die aktive Datei für die gewählten Personen oder mit einer Passphrase. Die verschlüsselte Datei wird als name.gpg daneben geschrieben.
command.crypto.changeRecipients=Verschlüsselung: Empfänger ändern…
command.crypto.changeRecipients.desc=Legt fest, für wen die aktive verschlüsselte Datei verschlüsselt ist. Die Änderung gilt ab dem nächsten Speichern.
command.crypto.removeEncryption=Verschlüsselung: Verschlüsselung entfernen…
command.crypto.removeEncryption.desc=Speichert nach Rückfrage den Text der aktiven verschlüsselten Datei als unverschlüsselte Datei daneben.
command.crypto.lockFile=Verschlüsselung: Datei sperren
command.crypto.lockFile.desc=Legt die aktive verschlüsselte Datei weg: Ihr Text verlässt den Speicher, bis Sie sie wieder entschlüsseln.
command.crypto.showInfo=Verschlüsselung: Details anzeigen
command.crypto.showInfo.desc=Zeigt, wer die aktive verschlüsselte Datei lesen kann, ihr Format und ihre Signatur.
command.crypto.encryptSelection=Verschlüsselung: Auswahl verschlüsseln…
command.crypto.encryptSelection.desc=Ersetzt den markierten Text durch eine verschlüsselte ASCII-Armor-Nachricht für die gewählten Personen.
command.crypto.decryptBlock=Verschlüsselung: Block an der Einfügemarke entschlüsseln
command.crypto.decryptBlock.desc=Entschlüsselt die PGP-Nachricht an der Einfügemarke und zeigt ihren Text in einer Karte zum Kopieren.
command.crypto.importPublicKey=Verschlüsselung: Öffentlichen Schlüssel importieren…
command.crypto.importPublicKey.desc=Fügt die öffentlichen Schlüssel aus einer Datei oder der geöffneten .asc-Datei Ihrem GnuPG-Schlüsselbund hinzu.
command.crypto.decryptToFile=Verschlüsselung: In Datei entschlüsseln…
command.crypto.decryptToFile.desc=Schreibt den entschlüsselten Inhalt der aktiven Datei in eine Datei Ihrer Wahl, für Inhalte, die kein Text oder zu groß zum Bearbeiten sind.
command.crypto.clearSign=Verschlüsselung: Text klarsignieren
command.crypto.clearSign.desc=Umschließt den Text des aktiven Puffers mit einer Klartext-Signatur Ihres Schlüssels.
command.crypto.signDetached=Verschlüsselung: Datei signieren (separat)
command.crypto.signDetached.desc=Schreibt file.asc neben die gespeicherte Datei: eine separate Signatur, die andere prüfen können.
command.crypto.verifySignature=Verschlüsselung: Signatur prüfen
command.crypto.verifySignature.desc=Prüft die Signatur eines klarsignierten Texts, der aktiven Datei (aus der .asc- oder .sig-Datei daneben) oder der Datei, die eine geöffnete Signatur signiert.
