settings.terminal.typeAhead.desc = Zeigt Eingaben an, bevor eine langsame Shell sie zurückgibt, abgeblendet bis dahin. Greift erst, wenn das Echo länger als 100 ms dauert, lokale Shells sind also nicht betroffen.
