command.edit.copyRectangle.desc=Behält die Spalten zwischen Punkt und Marke, ohne sie zu entfernen.
command.edit.yankRectangle.desc=Fügt das zuletzt ausgeschnittene Rechteck mit seiner Ecke an der Einfügemarke ein.
command.edit.deleteRectangle.desc=Entfernt die Spalten zwischen Punkt und Marke, ohne sie zu behalten.
command.edit.clearRectangle.desc=Ersetzt die Spalten zwischen Punkt und Marke durch Leerzeichen.
command.edit.openRectangle.desc=Fügt Leerzeichen ein und schiebt den Text im Rechteck nach rechts.
command.edit.stringRectangle.desc=Ersetzt die Spalten zwischen Punkt und Marke zeilenweise durch eine Zeichenkette.
command.edit.numberRectangle.desc=Fügt fortlaufende Nummern am linken Rand des Rechtecks ein.
command.edit.narrowToRegion.desc=Beschränkt den Puffer auf die Auswahl; der Rest bleibt in der Datei, ist aber nicht erreichbar.
command.edit.narrowToDefun.desc=Beschränkt den Puffer auf die Funktion um die Einfügemarke.
command.edit.narrowToFoldRegion.desc=Beschränkt den Puffer auf den faltbaren Block um die Einfügemarke.
command.edit.widen.desc=Stellt den Zugriff auf das gesamte Dokument wieder her.
command.structure.narrowFold.desc=Schränkt den Editor auf den eigenen Block des gewählten Symbols ein oder erweitert ihn wieder, wenn das Strukturfenster ihn eingeschränkt hat; solange aktiv, schränkt ein Klick auf ein Symbol darauf ein.
command.edit.queryReplace.desc=Ersetzt Treffer einzeln mit Bestätigung (y/n/! für alle/. zum Ersetzen und Anhalten/q zum Beenden).
command.edit.queryReplaceRegexp.desc=Interaktives Ersetzen, bei dem der Suchbegriff ein regulärer Ausdruck ist; $1 verweist auf eine Gruppe.
command.edit.yankFromRing.desc=Wählt einen früheren Kill-Ring-Eintrag aus und fügt ihn ein.
command.edit.copyToRegister.desc=Die Auswahl in ein Register kopieren, das die nächste Taste benennt; mit Präfixargument ausschneiden.
command.edit.insertRegister.desc=Den in einem Register gespeicherten Text einfügen; der Cursor bleibt davor.
command.edit.pointToRegister.desc=Datei und Position des Cursors in einem Register speichern, das die nächste Taste benennt.
command.edit.jumpToRegister.desc=Zur in einem Register gespeicherten Position gehen und die Datei bei Bedarf öffnen.
command.edit.viewRegisters.desc=Alle Register auflisten; eines wählen, um seinen Text einzufügen oder zu seiner Position zu gehen.
command.edit.killWord.desc=Vom Cursor bis zum Wortende löschen.
command.edit.deleteSubwordForward.desc=Löscht vom Cursor bis zur nächsten Teilwortgrenze.
command.edit.deleteSubwordBackward.desc=Löscht vom Cursor bis zur vorherigen Teilwortgrenze.
command.edit.moveLineDown.desc=Die aktuelle Zeile eine Zeile nach unten verschieben.
command.edit.insertLineBelow.desc=Eine neue, eingerückte Zeile unter der aktuellen öffnen, egal wo der Cursor in ihr steht.
command.edit.completeStatement.desc=Die Anweisung am Cursor abschließen: offene Zeichenketten und Klammern schließen, das nötige ; oder den { }-Block ergänzen und den Cursor dorthin setzen, wo die nächste Zeile beginnt.
command.edit.insertLineAbove.desc=Eine neue Zeile über der aktuellen öffnen, mit deren Einrückung.
command.edit.deleteLine.desc=Die aktuelle Zeile oder alle Zeilen der Auswahl löschen, ohne sie in die Zwischenablage zu legen.
command.edit.selectLine.desc=Die aktuelle Zeile auswählen; erneut, um die nächste Zeile hinzuzunehmen.
command.edit.indentLines.desc=Die aktuelle Zeile oder alle Zeilen der Auswahl einrücken, egal wo der Cursor steht.
command.edit.outdentLines.desc=Die Einrückung der aktuellen Zeile oder aller Zeilen der Auswahl verringern, egal wo der Cursor steht.
command.edit.moveLineUp.desc=Die aktuelle Zeile eine Zeile nach oben verschieben.
command.edit.paste.desc=Den Inhalt der Zwischenablage am Cursor einfügen.
command.edit.redo.desc=Die letzte rückgängig gemachte Änderung wiederholen.
command.edit.selectAll.desc=Das gesamte Dokument auswählen.
command.edit.setMark.desc=Die Auswahlmarke setzen; Bewegung erweitert dann die Auswahl.
command.edit.universalArgument.desc=Startet ein numerisches Präfixargument für den nächsten Befehl — C-u, weitere C-u multiplizieren mit vier, oder Ziffern eingeben.
command.edit.toggleComment.desc=Die Zeile oder Auswahl auskommentieren oder einkommentieren.
command.edit.transposeChars.desc=Die beiden Zeichen um den Cursor vertauschen.
command.edit.transposeLines.desc=Die aktuelle Zeile mit der darüber vertauschen.
command.edit.transposeWords.desc=Die beiden Wörter um den Cursor vertauschen.
command.edit.undo.desc=Die letzte Änderung rückgängig machen.
command.editor.exportPdf.desc=Den Text der aktuellen Datei als PDF exportieren (helles Design).
