command.file.new.desc=Eine neue, leere Datei erstellen.
command.file.open.desc=Eine Datei mit dem Dateiauswahldialog des Systems öffnen.
command.file.run.desc=Die aktuelle Datei ausführen (Java, Python oder Shell).
