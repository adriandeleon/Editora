settings.terminal.shellIntegration.desc = bash und zsh teilen dem Terminal ihr Verzeichnis und die Ausgabe jedes Befehls mit: Links werden aufgelöst, „Neues Terminal hier“ startet dort, und „Ausgabe des letzten Befehls kopieren“ funktioniert. Ihre eigenen Startdateien bleiben unverändert.
