dialog.mcp.enableTitle=MCP-Server — Sicherheitshinweis
dialog.mcp.enableHeader=MCP-Server aktivieren?
dialog.mcp.enableBody=Beim Aktivieren des MCP-Servers wird ein lokaler HTTP-Endpunkt (nur an 127.0.0.1 gebunden) gestartet, über den ein KI-Agent deine geöffneten Dateien lesen und bearbeiten, sie auf die Festplatte speichern, Diagnosen, Suchergebnisse und den Git-Status einsehen und Editor-Befehle in deinem Namen ausführen kann. Verbindungen erfordern ein geheimes Token, aber jedes auf diesem Computer laufende Programm könnte versuchen, es zu verwenden. Aktiviere dies nur, wenn du das Risiko verstehst und akzeptierst.
dialog.trust.title=Workspace-Vertrauen — Sicherheitshinweis
dialog.trust.header=Build-Aufgaben aus dem Ordner {0} ausführen?
dialog.trust.body=Dieser Ordner enthält ein Build-Skript, das er selbst mitliefert ({0}). Beim Ausführen einer Build-Aufgabe würde dieses Skript mit Ihren Rechten laufen — es kann Ihre Dateien lesen, ändern oder löschen und auf das Netzwerk zugreifen. Vertrauen Sie diesem Ordner nur, wenn Sie der Herkunft seines Inhalts vertrauen.\n\n{1}\n\nDas Vertrauen wird für diesen Ordner und die darin enthaltenen Ordner gespeichert. Sie können es später in den Einstellungen unter Arbeitsbereich widerrufen.
dialog.trust.accept=Ordner vertrauen und ausführen
dialog.lsp.trust.header=Die Einstellungen des Ordners {0} verwenden?
dialog.lsp.trust.body=Die .editora/settings.json dieses Ordners legt fest, wie seine Dateien bearbeitet werden, und kann Programme wählen: Sprachserver, Build-Befehle, Debugger. Diese Programme würden mit Ihren Rechten laufen — sie können Ihre Dateien lesen, ändern oder löschen und auf das Netzwerk zugreifen. Vertrauen Sie diesem Ordner nur, wenn Sie der Herkunft seines Inhalts vertrauen.\n\n{0}\n\n{1}\n\nDas Vertrauen wird für diesen Ordner und die darin enthaltenen Ordner gespeichert. Sie können es später in den Einstellungen unter Erweitert widerrufen.
dialog.lsp.trust.accept=Ordner vertrauen

