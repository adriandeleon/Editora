command.git.log.createPatch.desc=Schreibt den im Git-Log ausgewählten Commit als Patch in eine Datei oder einen neuen Puffer.
command.git.addToGitignore.desc=Die aktuelle Datei in die .gitignore des Repositorys eintragen.
command.git.stash.desc=Ihre nicht committeten Änderungen stashen.
command.git.stashDrop.desc=Einen Stash-Eintrag löschen.
command.git.stashPop.desc=Den letzten Stash anwenden und entfernen.
command.git.stashes.desc=Listet die Stashes mit ihren Dateien auf: anzeigen, anwenden, poppen, verwerfen oder einen Branch daraus erstellen.
command.git.switchBranch.desc=Das Branch-Dropdown öffnen, um einen Branch auszuchecken.
command.git.toggleBlame.desc=Blendet die Blame-Anmerkungsspalte am Rand ein oder aus (Autor und Datum pro Zeile).
command.git.unstash.desc=Einen von Ihnen gewählten Stash-Eintrag anwenden.
command.help.about.desc=Version, Lizenz und Links für Editora anzeigen.
command.help.documentation.desc=Öffnet die Editora-Dokumentation für diese Version im Browser.
command.help.reportProblem.desc=Einen geschwärzten Problembericht aus dem Debug-Protokoll erstellen und dafür ein GitHub-Issue öffnen.
command.http.runFile.desc=Jede Anfrage in der .http-Datei der Reihe nach senden.
command.http.toggleInlineResults.desc=Das letzte Ergebnis jeder Anfrage hinter ihrer Zeile in einer .http-Datei anzeigen oder ausblenden.
