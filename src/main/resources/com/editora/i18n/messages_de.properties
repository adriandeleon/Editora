settings.terminal.bell = Beim Glockenzeichen aufblinken
settings.terminal.scrollback = Verlaufszeilen
settings.terminal.scrollback.desc = Zeilen Verlauf oberhalb des Bildschirms, bis zu 50.000. Jedes Terminal kann etwa 1 MB pro 1.000 Zeilen belegen. Gilt für neue Terminals.
settings.section.terminalKeys = Tasten
settings.terminal.ideCommands = Befehle, die Editora erreichen
settings.terminal.ideCommands.desc = Alle anderen Tasten gehen an die Shell. Einträge durch Kommas trennen: Befehls-IDs (tool.* umfasst alle Werkzeugfenster) erreichen Editora über Tasten, die eine Shell nicht nutzt, etwa Strg+Umschalt-Kürzel; eine Taste selbst, etwa M-1, erreicht Editora unabhängig von ihrer Belegung. Unter macOS erreichen Cmd-Tastenkürzel immer Editora.
settings.terminal.macOptionIsMeta = Wahltaste als Meta (macOS)
settings.terminal.macOptionIsMeta.desc = An: Wahltaste+Taste sendet Escape und die Taste, für readline und Emacs (M-b, M-f). Aus: Die Wahltaste tippt die Zeichen Ihrer Tastaturbelegung, etwa @ [ ] { } auf vielen Belegungen. Unter Linux und Windows ist Alt immer Meta.
settings.terminal.confirmMultilinePaste = Einfügen mehrerer Zeilen bestätigen
settings.terminal.confirmMultilinePaste.desc = Vor dem Einfügen mehrerer Zeilen in ein Programm fragen, das jede Zeile sofort ausführen würde (sh, eine REPL, eine ältere entfernte Shell). bash und zsh kennzeichnen Einfügungen und fragen nie.
settings.terminal.copyOnSelect = Beim Auswählen kopieren
settings.terminal.copyOnSelect.desc = Eine Auswahl landet sofort in der Zwischenablage, ohne Kopieren. Unter Linux ist sie außerdem die Auswahl für die mittlere Maustaste, ob dies an ist oder nicht.
settings.terminal.clipboardWrites = Programme dürfen in die Zwischenablage kopieren
settings.terminal.clipboardWrites.desc = Programme können Text in die Zwischenablage legen (OSC 52); so kopieren tmux und Terminal-Editoren über SSH. Lesen können sie sie nie.
settings.terminal.notifications = Desktop-Benachrichtigungen
settings.terminal.notifications.desc = Ein Programm kann eine Benachrichtigung senden (OSC 9 oder 777), etwa ein Build, der fertig ist. Sie erscheint auf dem Desktop, wenn Sie das Terminal nicht ansehen; sein Tab wird in jedem Fall markiert.
settings.terminal.confirmClose = Vor dem Schließen eines Terminals fragen, in dem ein Programm läuft

