command.run.config.desc=Eine gespeicherte Konfiguration ausführen.
command.run.saveConfig.desc=Die aktive Datei als Ausführungskonfiguration speichern: ihre Hauptklasse oder das Python- bzw. Shell-Skript.
command.run.deleteConfig.desc=Eine gespeicherte Konfiguration löschen.
command.file.runWithArgs.desc=Die aktuelle Datei mit Programmargumenten ausführen.
command.file.save.desc=Die aktuelle Datei speichern.
command.file.saveAs.desc=Die aktuelle Datei unter einem neuen Namen speichern.
command.file.saveAll.desc=Alle geänderten Dateien in diesem Fenster speichern.
command.file.revert.desc=Ungespeicherte Änderungen verwerfen und die Datei neu von der Festplatte lesen.
command.file.toggleAutoSave.desc=Das automatische Speichern ein- oder ausschalten.
command.find.replace.desc=Text in der aktuellen Datei suchen und ersetzen.
command.find.show.desc=Inkrementelle Suche (Groß-/Kleinschreibung, Regex, ganzes Wort).
command.find.showBackward.desc=Inkrementelle Suche, rückwärts suchend.
command.git.blameShowCommit.desc=Den Diff des Commits öffnen, der die Cursorzeile zuletzt geändert hat.
command.git.nextChange.desc=Den Cursor zu den nächsten geänderten Zeilen dieser Datei bewegen (verglichen mit HEAD).
command.git.previousChange.desc=Den Cursor zu den vorherigen geänderten Zeilen dieser Datei bewegen (verglichen mit HEAD).
command.git.peekChange.desc=Zeigen, was die Änderung am Cursor ersetzt hat, mit Aktionen zum Zurücksetzen, Vormerken und Kopieren.
command.git.revertHunk.desc=Die HEAD-Zeilen der Änderung am Cursor wieder in den Puffer einsetzen (rückgängig machbar; nichts wird geschrieben).
command.git.stageHunk.desc=Nur die Änderung am Cursor vormerken; die Datei wird zuerst gespeichert.
command.git.blamePreviousRevision.desc=Öffnet die Datei im Stand vor dem Commit, dem die Zeile unter dem Cursor zugeschrieben wird – ebenfalls mit Blame.
command.git.blame.ignoreWhitespace.desc=Blame übergeht in diesem Fenster Commits, die nur Leerraum geändert haben (git blame -w).
command.git.blame.detectMoves.desc=Blame verfolgt in diesem Fenster verschobene oder kopierte Zeilen innerhalb und zwischen Dateien (git blame -M -C).
command.git.applyPatch.desc=Wendet eine .patch/.diff-Datei – oder den aktiven Puffer, wenn er ein Patch ist – auf Arbeitsverzeichnis oder Index an.
command.git.createPatch.desc=Schreibt die bereitgestellten Änderungen, die nicht bereitgestellten Änderungen oder einen Commit als Patch in eine Datei oder einen neuen Puffer.
command.git.clone.desc=Ein Git-Repository in einen Ordner klonen.
command.git.commit.desc=Das Commit-Werkzeugfenster öffnen und das Nachrichtenfeld fokussieren.
command.git.fetch.desc=Änderungen vom Remote abrufen, ohne zu mergen.
command.git.cancel.desc=Den laufenden Clone, Fetch, Pull oder Push abbrechen.
command.git.fileHistory.desc=Die Commits, die die aktuelle Datei geändert haben, im Werkzeugfenster „Git-Verlauf“ anzeigen.
command.git.newBranch.desc=Einen neuen Git-Branch erstellen.
command.git.newBranchFrom.desc=Einen Branch von einem beliebigen Branch oder Tag erstellen, mit oder ohne Wechsel.
command.git.checkoutRevision.desc=Einen Tag, Branch oder Commit per Name auschecken.
command.git.renameBranch.desc=Einen lokalen Branch umbenennen.
command.git.deleteBranch.desc=Einen lokalen Branch löschen; nicht gemergte Commits werden vorher bestätigt.
command.git.deleteRemoteBranch.desc=Einen Branch auf seinem Remote löschen, nach Bestätigung.
command.git.mergeBranch.desc=Einen Branch in den ausgecheckten Branch mergen.
command.git.rebaseOnto.desc=Den aktuellen Branch auf einen anderen Branch aufsetzen.
command.git.compareBranch.desc=Die Dateien prüfen, die sich zwischen einem Branch und dem aktuellen unterscheiden.
command.git.setUpstream.desc=Den Remote-Branch wählen, dem der aktuelle Branch folgt.
command.git.unsetUpstream.desc=Der aktuelle Branch folgt keinem Remote-Branch mehr.
command.git.pushTo.desc=Den aktuellen Branch auf ein gewähltes Remote pushen, optional unter anderem Namen.
command.git.pushForce.desc=Den Remote-Branch mit dem lokalen überschreiben, nur wenn er sich seit dem letzten Fetch nicht bewegt hat.
command.git.pushTags.desc=Alle lokalen Tags pushen, die dem Remote fehlen.
command.git.fetchRemote.desc=Von einem Remote abrufen und dessen gelöschte Branches entfernen.
command.git.remotes.desc=Remotes auflisten, hinzufügen, umbenennen, umstellen, abrufen, bereinigen und entfernen.
command.git.worktrees.desc=Die Worktrees des Repositorys auflisten, hinzufügen, öffnen, entfernen und bereinigen.
command.git.pull.desc=Änderungen vom Remote abrufen und mergen.
command.git.pullRebase.desc=Pull ausführen und die lokalen Commits auf die des Remotes neu aufsetzen.
command.git.pullMerge.desc=Pull ausführen und die Commits des Remotes in den Branch mergen.
command.git.setPullMode.desc=Legt fest, wie Pull die Commits des Remotes übernimmt: nur Fast-Forward, Rebase oder Merge.
command.git.continueOperation.desc=Setzt den angehaltenen Merge, Rebase, Cherry-Pick oder Revert fort, sobald die Konflikte gelöst sind.
command.git.skipOperation.desc=Überspringt den Commit, an dem ein Rebase, Cherry-Pick oder Revert angehalten hat.
command.git.abortOperation.desc=Bricht den laufenden Merge, Rebase, Cherry-Pick oder Revert ab und stellt den Zustand davor wieder her.
command.git.push.desc=Lokale Commits zum Remote pushen.
command.git.refresh.desc=Den Git-Status und die Randmarkierungen aktualisieren.
command.git.stageFile.desc=Die Änderungen der aktuellen Datei vormerken.
command.git.stageAll.desc=Alle Änderungen im Repository vormerken (git add -A).
command.git.commitAndPush.desc=Mit der Nachricht im Commit-Fenster committen und danach den Branch pushen. Schlägt der Commit fehl, wird nicht gepusht.
command.git.commitAmend.desc=Schaltet „Amend“ im Commit-Fenster um: Der nächste Commit ersetzt den letzten (git commit --amend).
command.git.undoLastCommit.desc=Nimmt den letzten Commit vom Branch, lässt seine Änderungen vorgemerkt und stellt seine Nachricht wieder ins Commit-Feld (git reset --soft HEAD~1).
command.git.commitMessageHistory.desc=Eine der zuletzt in diesem Repository verwendeten Commit-Nachrichten auswählen und ins Commit-Feld übernehmen.
command.git.unstageAll.desc=Hebt alle Vormerkungen auf; der Inhalt der Dateien bleibt unverändert.
command.git.discardAll.desc=Verwirft alle lokalen Änderungen: Verfolgte Dateien werden auf den letzten Commit zurückgesetzt, nicht verfolgte gelöscht. Fragt vorher nach.
command.git.toggleAutoFetch.desc=Holt das aktive Repository alle paar Minuten im Hintergrund ab. Nur in einem vertrauenswürdigen Ordner oder einem Repository, in dem Sie in dieser Sitzung selbst Fetch, Pull oder Push ausgeführt haben.
