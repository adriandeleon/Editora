dialog.httpTrust.body=This request reads values from outside the .http file — {0} — and sends them to {1}. A .http file that came with a cloned repository can use this to send your environment variables or .env secrets to any server.\n\n{2}\n\nTrusting is remembered for this folder and the folders inside it, and also lets its build scripts run. You can revoke it later in Settings under Workspace.
