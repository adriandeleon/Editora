dialog.httpScripts.header=Run scripts from the folder {0}?
dialog.httpScripts.body={0} has JavaScript response handlers or pre-request scripts. Running them runs code from this folder on your Node.js: it can read the responses and the environment''s variables, and make network requests. A .http file that came with a cloned repository can use this to send what it reads anywhere. Editora starts Node.js without your environment variables and, on Node.js 20 or later, without file writes or child processes.\n\n{1}\n\nTrusting is remembered for this folder and the folders inside it, and also lets its build scripts run and its requests read secrets. You can revoke it later in Settings under Workspace.
