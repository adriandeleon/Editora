settings.httpClient.hint=Run .http/.rest requests with Editora's built-in HTTP client — click the ▶ next to a request, or use the Run Request and Run All Requests commands (the palette shows their keys). The last responses of each file are kept in the config folder with credential headers masked, and a request that reads environment secrets asks first when its folder is not trusted. Environment files (http-client.env.json) and in-file variables are supported.
settings.httpClient.scripts=Run JavaScript response handlers and pre-request scripts
settings.httpClient.scriptsHint=Run a request's pre-request scripts (< {% … %}, < ./sign.js) before it is sent and its response handlers (> {% … %}, > ./check.js) after its response arrives, on Node.js: client.test results show in the Tests block, request.variables.set values are used by the request, and client.global values by later requests as {{name}}. Only from trusted folders; Node.js gets no environment variables and, on Node.js 20 or later, cannot write files or start processes. # @assert and # @capture lines work without Node.js.
settings.httpClient.inlineResults=Show results after each request line
settings.httpClient.inlineResultsHint=After a request runs, its line in the editor shows how it went — status, time and failed tests — and its ▶ takes the colour of the result. Click the result to show that response. The results come from the response history, so they are back when the file is reopened.
