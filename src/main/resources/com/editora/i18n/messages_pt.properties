dialog.httpTrust.header=Enviar segredos a partir da pasta {0}?
dialog.httpTrust.body=Esta requisição lê valores de fora do ficheiro .http — {0} — e envia-os para {1}. Um ficheiro .http que tenha vindo com um repositório clonado pode usar isto para enviar as suas variáveis de ambiente ou os segredos do .env para qualquer servidor.\n\n{2}\n\nA confiança fica memorizada para esta pasta e para as pastas nela contidas, e também permite executar os seus scripts de compilação. Pode revogá-la mais tarde nas Definições, em Espaço de trabalho.
dialog.httpTrust.accept=Confiar na pasta e enviar
dialog.httpScripts.header=Executar scripts da pasta {0}?
dialog.httpScripts.body={0} tem scripts JavaScript de tratamento da resposta ou pré-requisição. Executá-los executa código desta pasta no seu Node.js: ele pode ler as respostas e as variáveis do ambiente, e fazer requisições de rede. Um arquivo .http que tenha vindo com um repositório clonado pode usar isso para enviar o que lê para qualquer lugar. O Editora inicia o Node.js sem as suas variáveis de ambiente e, no Node.js 20 ou mais recente, sem gravação de arquivos nem processos filhos.\n\n{1}\n\nA confiança fica memorizada para esta pasta e para as pastas nela contidas, e também permite executar os seus scripts de compilação e que as suas requisições leiam segredos. Você pode revogá-la mais tarde nas Configurações, em Espaço de trabalho.
dialog.httpScripts.accept=Confiar na pasta e executar
dialog.saveResponse.title=Salvar resposta HTTP
settings.httpClient.enable=Ativar Cliente HTTP (executar arquivos .http)
settings.httpClient.hint=Execute requisições .http/.rest com o cliente HTTP integrado do Editora — clique no ▶ ao lado de uma requisição ou use os comandos "Executar requisição" e "Executar todas as requisições" (a paleta mostra suas teclas). As últimas respostas de cada arquivo ficam na pasta de configuração com os cabeçalhos de credenciais mascarados, e uma requisição que lê segredos do ambiente pergunta antes se a pasta dela não for confiável. Arquivos de ambiente (http-client.env.json) e variáveis no arquivo são suportados.
settings.httpClient.scripts=Executar scripts JavaScript de tratamento da resposta e pré-requisição
settings.httpClient.scriptsHint=Executa no Node.js os scripts pré-requisição (< {% … %}, < ./sign.js) de uma requisição antes de ela ser enviada e os scripts de tratamento da resposta (> {% … %}, > ./check.js) depois que a resposta chega: os resultados de client.test aparecem no bloco Testes, os valores de request.variables.set são usados pela própria requisição, e os valores de client.global por requisições posteriores como {{name}}. Somente de pastas confiáveis; o Node.js não recebe variáveis de ambiente e, no Node.js 20 ou mais recente, não pode gravar arquivos nem iniciar processos. As linhas # @assert e # @capture funcionam sem Node.js.
settings.httpClient.inlineResults=Mostrar os resultados após cada linha de requisição
settings.httpClient.inlineResultsHint=Depois que uma requisição é executada, sua linha no editor mostra como ela foi — status, tempo e testes com falha — e o ▶ dela assume a cor do resultado. Clique no resultado para mostrar essa resposta. Os resultados vêm do histórico de respostas, então voltam quando o arquivo é reaberto.
settings.httpClient.nodePath=Node.js para scripts HTTP
settings.httpClient.nodePathHint=Deixe vazio para usar o Node.js definido em Depuração → JavaScript (senão uma versão do .nvmrc que o nvm tenha; senão o node do PATH).
settings.httpClient.scriptTimeout=Tempo limite dos scripts (segundos)
settings.httpClient.scriptTimeoutHint=Um script que ainda estiver em execução após esse tempo é interrompido.
