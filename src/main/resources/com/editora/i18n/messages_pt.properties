git.auth.hint.https=O Git não conseguiu autenticar-se por HTTPS, e o Editora nunca pede uma palavra-passe. Configure um auxiliar de credenciais (git config --global credential.helper …) — para o GitHub, execute: gh auth setup-git — ou use um remoto SSH e tente novamente.
git.auth.hint.ssh=O servidor não aceitou nenhuma das suas chaves SSH. Verifique se há um agente SSH em execução com a sua chave (ssh-add -l; adicione-a com ssh-add) e se a chave pública está registada no remoto. O Editora não pode pedir a frase secreta de uma chave.
git.auth.hint.hostKey=O SSH não conhece a chave de host deste servidor e o Editora não pode perguntar se deve confiar nela. Ligue-se ao host uma vez a partir de um terminal (por exemplo: ssh -T git@github.com), verifique e aceite a chave e tente novamente.
