command.edit.queryReplaceRegexp.desc=Substituição interativa em que a pesquisa é uma expressão regular; $1 refere-se a um grupo.
command.edit.yankFromRing.desc=Escolhe uma entrada anterior do kill ring e insere-a.
command.edit.copyToRegister.desc=Copia a seleção para um registro nomeado pela próxima tecla; com argumento de prefixo, recorta.
command.edit.insertRegister.desc=Insere o texto salvo em um registro, deixando o cursor antes dele.
command.edit.pointToRegister.desc=Salva o arquivo e a posição do cursor em um registro nomeado pela próxima tecla.
command.edit.jumpToRegister.desc=Vai para a posição salva em um registro, abrindo o arquivo se necessário.
command.edit.viewRegisters.desc=Lista todos os registros; escolha um para inserir o texto ou ir para a posição.
command.edit.killWord.desc=Exclui do cursor até o fim da palavra.
command.edit.deleteSubwordForward.desc=Exclui do cursor até o próximo limite de subpalavra.
command.edit.deleteSubwordBackward.desc=Exclui do cursor até o limite de subpalavra anterior.
command.edit.moveLineDown.desc=Move a linha atual uma posição para baixo.
command.edit.insertLineBelow.desc=Abre uma nova linha indentada abaixo da atual, onde quer que esteja o cursor nela.
command.edit.completeStatement.desc=Termina a instrução no cursor: fecha as strings e os parênteses, acrescenta o ; ou o bloco { } de que precisa e põe o cursor onde começa a linha seguinte.
command.edit.insertLineAbove.desc=Abre uma nova linha acima da atual, com o seu recuo.
command.edit.deleteLine.desc=Exclui a linha atual, ou todas as linhas da seleção, sem colocá-las na área de transferência.
command.edit.selectLine.desc=Seleciona a linha atual; de novo, para incluir a próxima.
command.edit.indentLines.desc=Aumenta o recuo da linha atual, ou de todas as linhas da seleção, onde quer que esteja o cursor.
command.edit.outdentLines.desc=Diminui o recuo da linha atual, ou de todas as linhas da seleção, onde quer que esteja o cursor.
command.edit.moveLineUp.desc=Move a linha atual uma posição para cima.
command.edit.paste.desc=Cola o conteúdo da área de transferência no cursor.
command.edit.redo.desc=Refaz a última edição desfeita.
command.edit.selectAll.desc=Seleciona todo o documento.
command.edit.setMark.desc=Define a marca de seleção; o movimento então estende a seleção.
command.edit.universalArgument.desc=Inicia um argumento numérico para o próximo comando — C-u, mais C-u para multiplicar por quatro, ou digite dígitos.
command.edit.toggleComment.desc=Comenta ou descomenta a linha ou a seleção.
command.edit.transposeChars.desc=Troca os dois caracteres ao redor do cursor.
command.edit.transposeLines.desc=Troca a linha atual com a de cima.
command.edit.transposeWords.desc=Troca as duas palavras ao redor do cursor.
command.edit.undo.desc=Desfaz a última edição.
command.editor.exportPdf.desc=Exporta o texto do arquivo atual para um PDF (tema claro).
command.editor.print.desc=Imprime o texto do arquivo atual, com pré-visualização de impressão.
command.file.clearRecent.desc=Limpa a lista de arquivos recentes.
command.file.find.desc=Abre um arquivo por correspondência aproximada de caminho.
command.file.new.desc=Cria um novo arquivo vazio.
command.file.open.desc=Abre um arquivo com o seletor de arquivos do sistema.
command.file.run.desc=Executa o arquivo atual (Java, Python ou shell).
command.run.mainClass.desc=Escolher e executar uma classe principal no projeto Maven ou Gradle do ficheiro ativo.
command.run.config.desc=Executar uma configuração guardada.
command.run.saveConfig.desc=Guardar o ficheiro ativo como configuração de execução: a sua classe principal ou o script Python ou de shell.
command.run.deleteConfig.desc=Eliminar uma configuração guardada.
command.file.runWithArgs.desc=Executa o arquivo atual com argumentos de programa.
command.file.save.desc=Salva o arquivo atual.
command.file.saveAs.desc=Salva o arquivo atual com um novo nome.
command.file.saveAll.desc=Salva todos os arquivos modificados abertos nesta janela.
command.file.revert.desc=Descarta as alterações não salvas e lê o arquivo do disco de novo.
command.file.toggleAutoSave.desc=Ativa ou desativa o salvamento automático.
command.find.replace.desc=Localiza e substitui texto no arquivo atual.
command.find.show.desc=Localização incremental (maiúsculas, regex, palavra inteira).
command.find.showBackward.desc=Localização incremental, pesquisando para trás.
command.git.blameShowCommit.desc=Abre o diff do commit que alterou por último a linha do cursor.
command.git.nextChange.desc=Move o cursor para as próximas linhas alteradas deste arquivo (em comparação com HEAD).
command.git.previousChange.desc=Move o cursor para as linhas alteradas anteriores deste arquivo (em comparação com HEAD).
command.git.peekChange.desc=Mostra o que a alteração no cursor substituiu, com ações para reverter, preparar e copiar.
command.git.revertHunk.desc=Devolve ao buffer as linhas de HEAD da alteração no cursor (pode ser desfeito; nada é gravado).
command.git.stageHunk.desc=Prepara apenas a alteração no cursor; o arquivo é salvo primeiro.
command.git.blamePreviousRevision.desc=Abre o arquivo como era antes do commit ao qual a linha do cursor é atribuída, também anotado.
command.git.blame.ignoreWhitespace.desc=Nesta janela, o blame ignora commits que só alteraram espaços (git blame -w).
command.git.blame.detectMoves.desc=Nesta janela, o blame segue linhas movidas ou copiadas dentro de um arquivo e entre arquivos (git blame -M -C).
command.git.applyPatch.desc=Aplica um arquivo .patch/.diff, ou o buffer ativo se for um patch, à árvore de trabalho ou ao índice.
command.git.createPatch.desc=Grava as alterações preparadas, as não preparadas ou um commit como patch, em um arquivo ou em um novo buffer.
command.git.clone.desc=Clona um repositório Git em uma pasta.
command.git.commit.desc=Abre o painel Commit e foca a caixa de mensagem.
command.git.fetch.desc=Busca alterações do remoto sem mesclar.
command.git.cancel.desc=Interrompe o clone, fetch, pull ou push em execução.
command.git.fileHistory.desc=Mostra na janela Histórico do Git os commits que alteraram o arquivo atual.
command.git.newBranch.desc=Cria um novo ramo Git.
command.git.newBranchFrom.desc=Criar um ramo a partir de qualquer ramo ou etiqueta, mudando ou não para ele.
command.git.checkoutRevision.desc=Fazer checkout de uma etiqueta, ramo ou commit pelo nome.
command.git.renameBranch.desc=Renomear um ramo local.
command.git.deleteBranch.desc=Eliminar um ramo local; os commits não fundidos são confirmados antes.
command.git.deleteRemoteBranch.desc=Eliminar um ramo no seu remoto, após confirmação.
command.git.mergeBranch.desc=Fundir um ramo no ramo atual.
command.git.rebaseOnto.desc=Reaplicar o ramo atual sobre outro ramo.
command.git.compareBranch.desc=Rever os ficheiros que diferem entre um ramo e o atual.
command.git.setUpstream.desc=Escolher o ramo remoto que o ramo atual acompanha.
command.git.unsetUpstream.desc=Fazer com que o ramo atual deixe de acompanhar um ramo remoto.
command.git.pushTo.desc=Enviar o ramo atual para um remoto escolhido, opcionalmente com outro nome.
command.git.pushForce.desc=Substituir o ramo remoto pelo local, apenas se não se moveu desde o último fetch.
command.git.pushTags.desc=Enviar todas as etiquetas locais que o remoto não tem.
command.git.fetchRemote.desc=Fazer fetch de um remoto e podar os seus ramos eliminados.
command.git.remotes.desc=Listar, adicionar, renomear, redirecionar, obter, podar e remover remotos.
command.git.worktrees.desc=Listar, adicionar, abrir, remover e podar as árvores de trabalho do repositório.
command.git.pull.desc=Puxa e mescla alterações do remoto.
command.git.pullRebase.desc=Fazer pull reaplicando seus commits locais sobre os do remoto.
command.git.pullMerge.desc=Fazer pull unindo os commits do remoto ao seu ramo.
command.git.setPullMode.desc=Escolhe como o Pull integra os commits do remoto: apenas fast-forward, rebase ou merge.
command.git.continueOperation.desc=Continua o merge, rebase, cherry-pick ou revert interrompido, depois de resolvidos os conflitos.
command.git.skipOperation.desc=Ignora o commit em que um rebase, cherry-pick ou revert parou.
command.git.abortOperation.desc=Aborta o merge, rebase, cherry-pick ou revert em curso e volta ao estado anterior.
command.git.push.desc=Envia os commits locais para o remoto.
command.git.refresh.desc=Atualiza o status do Git e os marcadores na margem.
command.git.stageFile.desc=Prepara as alterações do arquivo atual.
command.git.stageAll.desc=Prepara todas as alterações do repositório (git add -A).
command.git.commitAndPush.desc=Confirma com a mensagem da janela Commit e depois envia o ramo. Se o commit falhar, nada é enviado.
command.git.commitAmend.desc=Liga ou desliga Emendar na janela Commit: o próximo commit substitui o último (git commit --amend).
command.git.undoLastCommit.desc=Retira o último commit do ramo, mantém as alterações preparadas e repõe a mensagem na caixa de commit (git reset --soft HEAD~1).
command.git.commitMessageHistory.desc=Escolhe uma das mensagens usadas recentemente neste repositório e coloca-a na caixa de commit.
command.git.unstageAll.desc=Remove do stage todas as alterações; os ficheiros mantêm o conteúdo.
command.git.discardAll.desc=Descarta todas as alterações locais: os ficheiros rastreados voltam ao último commit e os não rastreados são eliminados. Pergunta primeiro.
command.git.toggleAutoFetch.desc=Faz fetch do repositório ativo em segundo plano de poucos em poucos minutos. Apenas numa pasta de confiança ou num repositório onde fez fetch, pull ou push nesta sessão.
command.git.setAutoFetchInterval.desc=Define quantos minutos passam entre dois fetches automáticos.
command.git.log.createPatch.desc=Escreve o commit selecionado no Git Log como patch, num ficheiro ou num novo buffer.
command.git.addToGitignore.desc=Adiciona o arquivo atual ao .gitignore do repositório.
command.git.stash.desc=Guarda suas alterações não commitadas (stash).
command.git.stashDrop.desc=Exclui uma entrada de stash.
command.git.stashPop.desc=Aplica e remove o último stash.
command.git.stashes.desc=Lista os stashes com seus arquivos: mostrar, aplicar, recuperar, descartar ou criar um ramo a partir de um.
command.git.switchBranch.desc=Abre o menu de ramos para fazer checkout de um ramo.
command.git.toggleBlame.desc=Mostra ou oculta a coluna de anotações de blame na medianiz (autor e data por linha).
command.git.unstash.desc=Aplica uma entrada de stash que você escolher.
command.help.about.desc=Mostra versão, licença e links do Editora.
command.help.documentation.desc=Abre o site de documentação do Editora desta versão no navegador.
