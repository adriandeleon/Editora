command.edit.copy.desc=Copia a seleção para a área de transferência.
command.edit.cut.desc=Recorta a seleção para a área de transferência.
command.edit.deleteChar.desc=Exclui o caractere após o cursor.
command.edit.duplicateLine.desc=Duplica a linha atual abaixo dela.
command.edit.exchangePointAndMark.desc=Troca o cursor e a marca de seleção.
command.edit.popMark.desc=Move o cursor para a marca mais recente do anel, percorrendo as anteriores a cada repetição.
command.edit.killLine.desc=Exclui do cursor até o fim da linha.
command.edit.yankPop.desc=Substitui o texto recém-colado pela entrada anterior do kill ring.
command.edit.killRectangle.desc=Remove as colunas entre ponto e marca, guardando-as para colar um retângulo.
