dialog.abortOperation.merge=Abortar o merge? Perdem-se todas as resoluções de conflitos e qualquer outra alteração feita desde o início; o ramo, o índice e a árvore de trabalho voltam ao estado anterior ao merge. Isto não pode ser desfeito.
dialog.abortOperation.rebase=Abortar o rebase? Perdem-se os commits já reaplicados, todas as resoluções de conflitos e qualquer outra alteração feita desde o início; o ramo volta ao ponto em que estava antes do rebase. Isto não pode ser desfeito.
dialog.abortOperation.cherryPick=Abortar o cherry-pick? Perdem-se todas as resoluções de conflitos e qualquer outra alteração feita desde o início, bem como os commits já aplicados; o ramo volta ao ponto em que estava. Isto não pode ser desfeito.
dialog.abortOperation.revert=Abortar o revert? Perdem-se todas as resoluções de conflitos e qualquer outra alteração feita desde o início, bem como os commits já revertidos; o ramo volta ao ponto em que estava. Isto não pode ser desfeito.
dialog.skipOperation.title={0}: ignorar commit
