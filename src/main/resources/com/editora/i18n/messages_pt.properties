command.edit.widen.desc=Restaura o acesso ao documento completo.
command.structure.narrowFold.desc=Restringe o editor ao bloco próprio do símbolo escolhido, ou alarga-o de novo se a janela Estrutura o restringiu; enquanto ativo, um clique num símbolo restringe a ele.
