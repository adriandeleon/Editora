command.edit.stringRectangle.desc=Substitui as colunas entre ponto e marca por um texto em cada linha.
command.edit.numberRectangle.desc=Insere números consecutivos ao longo da margem esquerda do retângulo.
command.edit.narrowToRegion.desc=Limita o buffer à seleção; o resto continua no ficheiro mas fica fora de alcance.
