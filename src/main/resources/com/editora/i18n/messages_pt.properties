dialog.lsp.trust.body=O ficheiro .editora/settings.json desta pasta define como os seus ficheiros são editados e pode escolher programas: servidores de linguagem, comandos de build, depuradores. Esses programas seriam executados com os seus privilégios: podem ler, alterar ou eliminar os seus ficheiros e aceder à rede. Só confie nesta pasta se confiar na origem do seu conteúdo.\n\n{0}\n\n{1}\n\nA confiança fica memorizada para esta pasta e para as pastas nela contidas. Pode revogá-la mais tarde nas Definições, em Avançado.
