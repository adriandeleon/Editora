git.auth.hint.hostKey=O SSH não conhece a chave de host deste servidor e o Editora não pode perguntar se deve confiar nela. Ligue-se ao host uma vez a partir de um terminal (por exemplo: ssh -T git@github.com), verifique e aceite a chave e tente novamente.
